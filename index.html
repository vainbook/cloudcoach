<script>
/* 正式站預設先畫 LINE 入口；demo／文字稽核則在 CSS 載入前切回原本表單，避免閃一下。 */
if (/[?&](?:demo|audit)=1/.test(location.search) || location.hash === '#selftest') {
  document.documentElement.dataset.ucBoot = 'demo';
}
else {
  try {
    /* ⚠️ 只認 pending（剛從 LINE 授權頁導回來）。用過的裝置要看到登入按鈕，
       先畫載入中的話按鈕就出不來了。 */
    if (sessionStorage.getItem('uc_line_pending_v1') === '1') {
      document.documentElement.dataset.ucLineState = 'loading';
      document.documentElement.dataset.ucLineStep = 'login';
    }
  } catch (e) {}
}
/* SDK 一下載完就先 init；錯誤先收著，boot.js 接手時再用正常錯誤畫面回報。 */
window.UC_LIFF_INIT_STATE = { promise: null, error: null };
window.UC_START_LIFF = function () {
  var state = window.UC_LIFF_INIT_STATE;
  if (document.documentElement.dataset.ucBoot !== 'line') return Promise.resolve();
  if (!state.promise) {
    state.promise = Promise.resolve().then(function () {
      return window.liff.init({ liffId: '2011543667-p1MX4tl7' });
    }).catch(function (error) { state.error = error; });
  }
  return state.promise;
};
</script>

<!-- ⚠️ 這條**曾經擋住第一次繪製**。實測（iPhone UA、壓縮後）這份 CSS 是
     237,491 bytes、766 個 @font-face 切片（中文字型要切成上百片）——
     比我們自己全部的程式碼（index＋app＋css＋store＋boot＋score 約 100 KB）還大兩倍多。
     `display=swap` 只讓**字型檔**不擋繪製，CSS 本身照擋。

     media="print" ＋ onload 換回 all：瀏覽器仍然會下載，但不列入繪製的必要條件。
     配上 display=swap，行為是「先用系統字畫出來，字型到了再換」——
     跟原本一樣，只是提早開始畫。
     ⚠️ 關 JS 的話 onload 不會跑，所以要留 noscript 的退路。

     順帶刪掉 DM+Serif+Display：`--display` 變數在 uc.css 裡**被引用 0 次**。 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600&family=Caveat:wght@500;600&display=swap"></noscript>
<link rel="stylesheet" href="uc.css?v=20260924-ff6e6dd9">
<!-- SDK 從解析 head 時就開始下載；boot.js 稍後接手初始化，不必等所有 App 程式載完。 -->
<script id="uc-liff-sdk" src="https://static.line-scdn.net/liff/edge/2/sdk.js" async fetchpriority="high"
  onload="this.dataset.ready='1';window.UC_START_LIFF()" onerror="this.dataset.failed='1'"></script>
</head>

<!-- ═══ #/ 登入／歡迎 ═══════════════════════════════ -->

      <p class="ey hero-ey">Munger Culture ・ est. 2017</p>

      <h1 class="hero-h">
        <span class="mask"><span>UC Training</span></span>
        <span class="mask"><span>Cloud Coach</span></span>
      </h1>

      <p class="hero-sub">找回自己，真誠開放</p>

      <div class="divider hero-div"><i></i><s></s></div>

      <p class="hero-lead" id="heroLead">歡迎回來。<br>
        先使自己完整，再學習愛與被愛。</p>

      <!-- 「輸入你的名字」與「載入範例學員」兩顆都拿掉了（2026-09-19）。
           ⚠️ demo **只留 logo 那個隱藏入口**（#logoDemoBtn）——
           首頁擺一顆看得見的 demo 鈕，學員一定會按到，然後看到的是別人的假資料。
           稱呼由 LINE 決定，或在評測 B01 自己填。 -->

      <div class="line-entry" id="lineEntry">
        <button class="btn pri" type="button" id="lineEnterBtn">雲端教練陪跑</button>
        <small>登入後會前往你的課程進度</small>
      </div>

      <div class="line-progress" id="lineProgress" aria-live="polite" aria-atomic="true">
        <p class="ey">Secure sign-in</p>
        <h2>正在回到你的教練室</h2>
        <ol class="line-steps">
          <li id="lineStepLogin"><i aria-hidden="true"></i><span>確認 LINE 登入</span></li>
          <li id="lineStepSync"><i aria-hidden="true"></i><span>同步課程進度</span></li>
          <li id="lineStepRoute"><i aria-hidden="true"></i><span>準備你的起始頁面</span></li>
        </ol>
        <div class="line-track" aria-hidden="true"><i></i></div>
        <p class="line-wait" id="lineSlow" hidden>連線比平常久一點，仍在處理中。</p>
        <button class="btn gh line-retry" type="button" id="lineRetry" hidden>重新連線</button>
      </div>
    </div>
  </div>
</section>
