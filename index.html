<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131B2E">
<title>UC — 牌組原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Serif+Display&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* UC Training 品牌視覺 — 依 uc-training/references/UC_brand-desigh.md */
:root{
  --navy:#131B2E; --navy-3:#1E2740;
  --beige:#E8E4DC; --white:#FFFFFF; --salmon:#E8A898;
  --b-70:rgba(232,228,220,.70); --b-50:rgba(232,228,220,.50);
  --b-34:rgba(232,228,220,.34); --b-18:rgba(232,228,220,.18); --b-10:rgba(232,228,220,.10);
  --n-60:rgba(19,27,46,.60); --n-40:rgba(19,27,46,.40); --n-14:rgba(19,27,46,.14);
  --r:6px; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --mono:"Space Grotesk",ui-monospace,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:#0C1220;font-family:"Noto Sans TC",system-ui,sans-serif;font-size:16px;line-height:1.7;
  color:var(--beige);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,[role="button"]:focus-visible,textarea:focus-visible{
  outline:2px solid var(--salmon);outline-offset:3px}

.app{position:relative;width:100%;max-width:430px;height:100dvh;background:var(--navy);
  overflow:hidden;display:flex;flex-direction:column}
.grain{position:absolute;inset:0;pointer-events:none;z-index:95;mix-blend-mode:overlay;opacity:.05}

/* 四角 L 型方括號 */
.bk{position:absolute;width:16px;height:16px;border:1px solid var(--b-18);pointer-events:none;z-index:5}
.bk.tl{top:calc(var(--st) + 12px);left:14px;border-right:0;border-bottom:0}
.bk.tr{top:calc(var(--st) + 12px);right:14px;border-left:0;border-bottom:0}
.bk.bl{bottom:calc(var(--sb) + 12px);left:14px;border-right:0;border-top:0}
.bk.br{bottom:calc(var(--sb) + 12px);right:14px;border-left:0;border-top:0}

/* ── 頂 ── */
.top{flex:none;padding:calc(var(--st) + 22px) 24px 0;display:flex;align-items:center;gap:12px;z-index:6}
.uc-logo{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.04em;
  border:1.5px solid var(--b-50);border-radius:50%;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;flex:none}
.rv{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  color:#A2502C;background:rgba(232,168,152,.22);border:.5px solid var(--salmon);
  border-radius:99px;padding:5px 11px;display:none}
.rv:active{background:rgba(232,168,152,.36)}
.sync{margin-left:14px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  color:var(--b-50);display:flex;align-items:center;gap:6px;
  border:.5px solid var(--b-10);border-radius:99px;padding:6px 11px}
.sync:active{background:var(--b-10)}
.sync::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--b-34)}
.sync[data-s="ok"]::before{background:#5C8A6B}
.sync[data-s="queued"]::before{background:var(--salmon)}
.sync[data-s="busy"]::before{background:var(--salmon);animation:pulse 1.1s ease-in-out infinite}
.sync[data-s="offline"]::before,.sync[data-s="off"]::before{background:var(--b-18)}
.sync[data-s="err"]::before{background:#C4452B}
.sync[data-s="err"]{color:#D98878}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.top .ct{margin-left:14px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--b-34)}
.top .ct b{color:var(--beige);font-weight:500;font-size:13px}
.icb{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);
  margin-right:-8px;color:var(--b-50)}
.icb:active{background:var(--b-10)}

.segwrap{flex:none;position:relative;padding:22px 24px 0;z-index:6}
.segs{display:flex;gap:3px;align-items:flex-end}
.seg{position:relative;height:3px;background:var(--b-18);overflow:hidden;border-radius:1px;
  transition:opacity .3s,height .3s;padding:0;min-width:6px}
.seg.now{height:5px}
.seg.full{opacity:1}
.seg u,.seg i{position:absolute;left:0;top:0;height:100%;width:0;
  transition:width .55s cubic-bezier(.3,.8,.3,1)}
.seg u{opacity:.34}
.segcur{position:absolute;top:13px;width:1px;height:7px;background:var(--salmon);
  transition:left .34s cubic-bezier(.3,.9,.3,1);pointer-events:none}
@keyframes segFlash{0%,100%{box-shadow:none}40%{box-shadow:0 0 0 2px rgba(232,168,152,.5)}}
.seg.flash{animation:segFlash .9s ease}

.theme{flex:none;padding:26px 24px 2px;text-align:center;min-height:78px;z-index:6}
.theme .mod{font-family:var(--mono);font-size:10px;letter-spacing:.34em;color:var(--b-50);margin-bottom:8px}
.theme h1{font-family:"Noto Serif TC",serif;font-size:26px;font-weight:700;line-height:1.35;letter-spacing:.01em}
.theme.sw .mod,.theme.sw h1{opacity:0;transform:translateY(5px)}
.theme .mod,.theme h1{transition:opacity .2s,transform .2s}

/* ── 牌列 ── */
.stage{flex:1;position:relative;perspective:1250px;overflow:hidden;touch-action:pan-y;
  display:flex;align-items:center;justify-content:center}
.deck{position:absolute;inset:0;transform-style:preserve-3d}
.cd{position:absolute;left:50%;top:50%;width:212px;height:296px;margin:-148px 0 0 -106px;
  will-change:transform,opacity;transform-style:preserve-3d}
.cd.hide{display:none}
.breathe{position:absolute;inset:0;transform-style:preserve-3d}
.cd.mid .breathe{animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.flip{position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .62s cubic-bezier(.32,.72,0,1)}
.cd.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r);backface-visibility:hidden;
  -webkit-backface-visibility:hidden;display:flex;flex-direction:column;overflow:hidden;
  background:var(--navy-3);border:.5px solid var(--b-10);
  box-shadow:0 2px 3px rgba(0,0,0,.28), 0 18px 40px -14px rgba(0,0,0,.6);
  transition:background .5s,border-color .5s}
.face.back{transform:rotateY(180deg);background:var(--beige);border-color:transparent;color:var(--navy)}
/* 填寫卡送出後仍保留溫暖層次，避免整張卡變成空白紙片 */
.cd.open .face.front.write{background:radial-gradient(circle at 88% 10%,var(--h-soft) 0%,transparent 31%),
  linear-gradient(145deg,#F4F0E8 0%,#E9E3D9 100%);
  border-color:rgba(19,27,46,.10);box-shadow:0 2px 3px rgba(0,0,0,.22),
  0 18px 40px -14px rgba(0,0,0,.52),inset 0 0 0 1px rgba(255,255,255,.35)}
.cd.revise .face.front.write{background:linear-gradient(145deg,#F8EEE9 0%,#EEDDD6 100%)}
.cd.ok .face.front.write{background:linear-gradient(145deg,#F4F0E8 0%,#E8E4DC 100%);
  box-shadow:0 2px 3px rgba(0,0,0,.22),0 18px 40px -14px rgba(0,0,0,.52),
  inset 0 0 0 1px var(--h-soft)}

.frame{position:absolute;inset:9px;border:.5px solid var(--b-10);border-radius:2px;
  transition:border-color .5s;pointer-events:none}
.cd.open .face.front.write .frame{border-color:var(--n-14)}
.cd.revise .face.front.write .frame{border-color:rgba(183,95,73,.38)}

/* 狀態圓標：時鐘＝等待回饋，驚嘆號＝需要編輯，勾＝認證完成 */
.pip{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;
  border:1px solid var(--n-40);background:#F8F5EF;display:none;align-items:center;
  justify-content:center;z-index:3;box-shadow:0 2px 8px rgba(19,27,46,.12);
  transition:border-color .4s,background .4s,transform .4s}
.cd.open .face.front .pip{display:flex}
.cd.open:not(.ok):not(.revise) .face.front.write .pip{border-color:var(--navy);background:var(--navy)}
.cd.revise .face.front .pip{border-color:#B75F49;background:var(--salmon)}
.cd.ok .face.front .pip{border-color:var(--h);background:var(--h)}
.pip .tick,.pip .dash,.pip .clock,.pip .alert{display:none}
.cd.open:not(.ok):not(.revise) .face.front.write .pip .clock{display:block;width:12px;height:12px;color:var(--beige)}
.cd.ok .pip .tick{display:block;width:11px;height:11px;color:var(--navy)}
.cd.revise .pip .alert{display:block;color:#8F402D;font-family:var(--mono);font-size:14px;
  line-height:1;font-weight:600;transform:translateY(-.5px)}
/* 知識卡與挑戰卡的圓標，顏色跟著卡型走 */
.face.movie .pip,.face.trial .pip{border-color:rgba(19,27,46,.28)}
.cd.ok .face.movie .pip{border-style:solid;border-color:#C9A227;background:#C9A227}
.cd.ok .face.movie .pip .tick{display:block;width:11px;height:11px;color:var(--navy)}
.cd.ok .face.trial .pip{border-style:solid;border-color:#C4452B;background:#C4452B}
.cd.ok .face.trial .pip .tick{display:block;width:11px;height:11px;color:var(--navy)}

/* 底部字樣：未開顯示動作，開過顯示狀態 */
.foot .f1{display:none}
.cd.open .face.front .foot .f0{display:none}
.cd.open .face.front .foot .f1{display:inline}
.foot .wp,.foot .wr,.foot .wa{display:none}
.cd.open:not(.ok):not(.revise) .face.front.write .foot .w0{display:none}
.cd.open:not(.ok):not(.revise) .face.front.write .foot .wp{display:inline}
.cd.revise .face.front.write .foot .w0{display:none}
.cd.revise .face.front.write .foot .wr{display:inline;color:#9B4C38}
.cd.ok .face.front.write .foot .w0{display:none}
.cd.ok .face.front.write .foot .wa{display:inline;color:#3D6A4D}
.cd.ok .face.movie .foot{color:#9C7C1B}
.cd.ok .face.trial .foot{color:#A03A22}

/* 有教練留言：圓標右下角一顆小點 */
.cd.fb .face.front .pip::after{content:"";position:absolute;right:-3px;bottom:-3px;
  width:6px;height:6px;border-radius:50%;background:var(--salmon);
  box-shadow:0 0 0 1.5px var(--beige)}
/* 尚未送達伺服器：小點收在狀態圓標右下角，不再漂在卡面上 */
.cd.q .face.front .pip::before{content:"";position:absolute;right:-3px;bottom:-3px;
  width:7px;height:7px;border-radius:50%;background:var(--salmon);
  box-shadow:0 0 0 2px #F4F0E8}
/* 需修改：左緣一道鮭粉 */
.cd.revise .face.front::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--salmon);border-radius:var(--r) 0 0 var(--r)}

/* 卡型裝飾邊框：故事＝素框，電影＝黃銅藤蔓，挑戰＝炙紅火焰。
   顏色固定不隨狀態變，因為它代表的是「這是哪一種牌」，不是進度。 */
.deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
  opacity:.5;transition:opacity .5s}
.cd.open .deco,.face.back .deco{opacity:1}
.face.movie .deco{color:#C9A227}
.face.trial .deco{color:#C4452B}

.en{flex:none;padding:5px 20px 0;text-align:center;font-family:"DM Serif Display",serif;
  font-size:13.5px;letter-spacing:.01em;transition:color .5s;line-height:1.35;color:var(--b-34)}
.face.movie .en{color:#C9A227}
.face.back.movie .en{color:#9C7C1B}
.cd.ok .face.front .frame{border-color:var(--h-soft)}
.face.back .frame{border-color:var(--h-soft)}

.kind{position:absolute;top:20px;left:0;right:0;text-align:center;font-family:var(--mono);
  font-size:10px;letter-spacing:.34em;color:var(--b-50);transition:color .5s}
.cd.open .face.front .kind{color:var(--n-40)}
.face.back .kind{color:var(--n-40)}

.no{position:absolute;top:36px;left:0;right:0;text-align:center;font-family:var(--mono);
  font-weight:500;font-size:10.5px;letter-spacing:.3em;color:var(--b-34);transition:color .5s}
.cd.ok .face.front .no{color:var(--h)}

.art{flex:1;display:flex;align-items:center;justify-content:center;padding:58px 24px 0;
  color:var(--b-34);transition:color .5s}
.face.movie .art,.face.trial .art{padding-top:52px}
.face.movie .ttl{font-size:15.5px;padding-bottom:0}
.face.movie .foot{padding-top:14px}
.cd.open .face.front.write .art{color:var(--h)}
.cd.revise .face.front.write .art{color:#B96C58}
.cd.ok .face.front .art{color:var(--h)}
.cd.open .face.front.write .glyph{width:58px;height:58px;stroke-width:1.35;opacity:.72}
.glyph{width:50px;height:50px}

.ttl{flex:none;padding:0 22px 4px;font-family:"Noto Serif TC",serif;font-size:16.5px;font-weight:400;
  line-height:1.55;text-align:center;color:var(--b-50);transition:color .5s}
.cd.open .face.front .ttl{color:var(--navy);font-weight:700}

.rule{flex:none;width:22px;height:.5px;background:var(--b-18);margin:14px auto 0;transition:background .5s}
.cd.ok .face.front .rule{background:var(--h-soft)}

.foot{flex:none;padding:12px 18px 22px;text-align:center;font-size:10px;letter-spacing:.24em;
  color:var(--b-34);transition:color .5s}
.cd.open .face.front .foot{color:var(--n-40)}

/* 卡背（電影／挑戰翻開後） */
.face.back .bd{flex:1;display:flex;flex-direction:column;justify-content:center;padding:54px 22px 12px}
.face.back .quote{font-family:"Noto Serif TC",serif;font-size:15px;font-weight:400;line-height:1.9;
  text-align:center;color:var(--navy)}
.face.back .ins{font-size:11.5px;line-height:1.75;color:var(--n-60);margin-top:14px;text-align:center}
.face.back .src{flex:none;padding:0 18px 22px;text-align:center;font-size:9px;letter-spacing:.3em;color:var(--n-40)}
.face.back .pass{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:#4E7A5E;text-align:center;margin-bottom:10px}

/* ── 卡下 ── */
.meta{flex:none;padding:10px 24px 0;text-align:center;min-height:48px;z-index:6}
.meta .g{font-size:12.5px;color:var(--b-70)}
.meta .s{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--b-34);margin-top:4px}
.acts{flex:none;display:flex;gap:9px;align-items:center;justify-content:center;
  padding:16px 24px calc(26px + var(--sb));z-index:6}
.btn{min-height:50px;border-radius:var(--r);font-size:15px;display:flex;align-items:center;
  justify-content:center;gap:8px;border:.5px solid var(--b-18);color:var(--b-70);
  transition:transform .1s cubic-bezier(.2,.9,.3,1),background .18s}
.btn:active{transform:scale(.965)}
.btn.pri{flex:1;background:var(--salmon);border-color:var(--salmon);color:var(--navy);
  font-weight:500;letter-spacing:.05em}
.btn.pri:active{background:#DC9585}
.btn.sq{width:50px}
#sortBtn .r1,#sortBtn .r2{transform-box:fill-box;transform-origin:center;
  transition:transform .38s cubic-bezier(.3,.9,.3,1)}
#sortBtn[data-mode="mix"]{border-color:var(--b-50);color:var(--beige)}
#sortBtn[data-mode="mix"] .r1{transform:rotate(-13deg)}
#sortBtn[data-mode="mix"] .r2{transform:rotate(13deg)}

/* ── 展開頁 ── */
.sheet{position:fixed;z-index:80;background:var(--beige);border-radius:var(--r);overflow:hidden;
  display:none;flex-direction:column;color:var(--navy)}
.sheet.on{display:flex}
.sheet.anim{transition:left .44s cubic-bezier(.32,.72,0,1),top .44s cubic-bezier(.32,.72,0,1),
  width .44s cubic-bezier(.32,.72,0,1),height .44s cubic-bezier(.32,.72,0,1),border-radius .44s}
.sheet .inner{flex:1;overflow-y:auto;padding:calc(var(--st) + 28px) 24px 10px;opacity:0;
  transition:opacity .22s .18s}
.sheet.open .inner{opacity:1}
.sheet .wno{font-family:var(--mono);font-size:10px;letter-spacing:.34em;color:var(--n-60)}
.sheet h2{font-family:"Noto Serif TC",serif;font-size:22px;font-weight:700;line-height:1.5;margin:12px 0 18px}
#sTitle:focus{outline:none}
.tips{list-style:none;display:grid;gap:9px;margin-bottom:20px}
.tips li{font-size:13.5px;color:var(--n-60);line-height:1.8;padding-left:16px;position:relative}
.tips li::before{content:"";position:absolute;left:0;top:12px;width:8px;height:.5px;background:var(--n-40)}
textarea{width:100%;min-height:190px;padding:15px;border:.5px solid var(--n-14);border-radius:var(--r);
  background:var(--white);color:var(--navy);font-family:"Noto Serif TC",serif;font-size:16px;
  line-height:2;resize:none}
textarea:focus{outline:none;border-color:var(--navy)}
textarea::placeholder{color:var(--n-40);font-family:"Noto Sans TC",sans-serif;font-size:14px}
/* 教練回饋 */
.fb{border:.5px solid var(--n-14);border-radius:var(--r);padding:13px 15px;margin-bottom:18px;
  background:#F1EEE7}
.fb.revise{border-color:var(--salmon);background:#F8EDE9}
.fb .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.badge{font-family:var(--mono);font-size:10px;letter-spacing:.2em;padding:3px 10px;
  border-radius:99px;border:.5px solid}
.badge.pending{border-color:var(--n-40);color:var(--n-60)}
.badge.revise{border-color:var(--salmon);color:#A2502C;background:rgba(232,168,152,.22)}
.badge.approved{border-color:#4E7A5E;color:#3D6A4D}
.fb .when{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--n-60)}
.fb .tx{font-size:14px;line-height:1.9;color:var(--navy)}
.fb .src{font-size:11px;letter-spacing:.06em;color:var(--n-40);margin-top:9px;
  padding-top:9px;border-top:.5px solid var(--n-14)}
.fb .wait{font-size:13.5px;line-height:1.8;color:var(--n-60)}
textarea[readonly]{background:#F1EEE7;color:var(--n-60)}

.opts{display:grid;gap:9px;margin-bottom:8px}
.opt{text-align:left;font-size:14.5px;line-height:1.75;padding:13px 15px;border:.5px solid var(--n-14);
  border-radius:var(--r);background:var(--white);color:var(--navy);min-height:48px}
.opt:active{background:#F4F1EA}
.opt:disabled{opacity:1;color:var(--navy)}
.opt .fb{display:block;font-size:12.5px;color:var(--n-60);margin-top:7px}
.opt.right{border-color:#4E7A5E;background:#E9EFE9}
.opt.wrong{border-color:var(--salmon);background:#F7EAE6}
.sheet .wfoot{flex:none;padding:14px 24px calc(20px + var(--sb));display:flex;gap:9px;
  border-top:.5px solid var(--n-14);opacity:0;transition:opacity .22s .18s}
.sheet.open .wfoot{opacity:1}
.sheet .btn{border-color:var(--n-14);color:var(--n-60)}
.sheet .btn.pri{background:var(--navy);border-color:var(--navy);color:var(--beige)}
.sheet .btn.pri:active{background:#25314E}

/* 完成蓋章 */
.stamp{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;
  pointer-events:none;background:rgba(232,228,220,.72)}
.stamp.on{display:flex}
.stamp span{font-family:var(--mono);font-size:11px;letter-spacing:.42em;color:var(--navy);
  border:1.5px solid var(--navy);border-radius:99px;padding:12px 26px;
  animation:stampIn .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes stampIn{0%{transform:scale(1.6) rotate(-8deg);opacity:0}
  60%{transform:scale(.94) rotate(-2deg);opacity:1}100%{transform:scale(1) rotate(-2deg);opacity:1}}

/* ── 全覽 ── */
.grid{position:absolute;inset:0;z-index:70;background:var(--navy);display:none;flex-direction:column}
.grid.on{display:flex;animation:fade .22s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grid .gh{flex:none;display:flex;align-items:center;gap:14px;padding:calc(var(--st) + 22px) 24px 14px}
.grid .gh .icb{margin-right:0}
.grid .gh h2{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700}
.grid .gh .lnk{display:none}
.grid .gh .gtot{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--b-34)}
.grid .gh .gtot b{color:var(--beige);font-weight:500;font-size:14px}
.grid .gs{display:none;flex:1;overflow-y:auto;padding:0 24px calc(30px + var(--sb))}
.grid.cards-on .gs{display:block}

/* 旅人總覽：四個道具只做第一層入口，原本卡片格完整保留在第二層。 */
.journey{flex:1;min-height:0;overflow-y:auto;padding:0 18px calc(22px + var(--sb));display:flex;
  flex-direction:column;gap:10px}
.grid.cards-on .journey{display:none}
.jhint{text-align:center;font-size:11px;letter-spacing:.08em;color:var(--b-50);margin:2px 0 0}
.jscene{position:relative;width:min(100%,350px);aspect-ratio:1;margin:0 auto;flex:none;
  --jx:50%;--jy:50%;--jr:0%;--jhalo:80px}
.jscene::after{content:"";position:absolute;left:14%;right:14%;bottom:7%;height:7%;z-index:0;
  background:radial-gradient(ellipse,rgba(0,0,0,.34),transparent 70%);filter:blur(8px);pointer-events:none}
.jfig{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;
  filter:drop-shadow(0 12px 14px rgba(0,0,0,.25));transition:opacity .28s,clip-path .28s}
.jfig.base{opacity:.36}.jfig.lit{opacity:.98;clip-path:circle(var(--jr) at var(--jx) var(--jy))}
.jhalo{position:absolute;z-index:0;left:var(--jx);top:var(--jy);width:var(--jhalo);height:var(--jhalo);
  transform:translate(-50%,-50%);border-radius:50%;opacity:0;pointer-events:none;transition:opacity .25s;
  background:radial-gradient(circle,rgba(201,162,39,.34),rgba(201,162,39,.09) 44%,transparent 72%);
  filter:blur(5px)}
.jscene.active .jhalo{opacity:1}
.jbody{position:absolute;z-index:3;left:35%;top:9%;width:31%;height:70%;border:0;border-radius:46% 46% 30% 30%}
.jbody::after{content:"點旅人 · 查看全部";position:absolute;left:50%;bottom:4%;transform:translate(-50%,8px);
  white-space:nowrap;background:var(--beige);color:var(--navy);border-radius:99px;padding:5px 8px;
  font-family:var(--mono);font-size:9px;letter-spacing:.06em;opacity:0;transition:.2s}
.jbody:hover::after,.jbody:focus-visible::after{opacity:1;transform:translate(-50%,0)}
.jhot{position:absolute;z-index:5;left:var(--x);top:var(--y);width:var(--w);height:var(--h);
  transform:translate(-50%,-50%);border-radius:45%}
.jhot::before{content:"";position:absolute;inset:10%;border:.5px solid var(--b-18);border-radius:50%;
  opacity:.45;transition:.2s}
.jhot:hover::before,.jhot:focus-visible::before,.jhot.active::before{inset:0;border-color:var(--salmon);
  box-shadow:0 0 0 4px rgba(232,168,152,.10),0 0 20px rgba(232,168,152,.20);opacity:1}
.jlabel{position:absolute;z-index:6;left:var(--jx);top:var(--jy);transform:translate(-50%,calc(-50% - var(--jlift,58px)));
  background:var(--beige);color:var(--navy);border-radius:99px;padding:6px 9px;font-size:10px;font-weight:700;
  white-space:nowrap;box-shadow:0 6px 15px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.2s}
.jscene.active .jlabel{opacity:1}
.jdetail{border:.5px solid var(--b-10);border-radius:var(--r);padding:13px 14px 14px;min-height:128px;
  background:rgba(30,39,64,.72)}
.jempty{font-size:13px;line-height:1.7;color:var(--b-50)}.jempty b{display:block;font-family:"Noto Serif TC",serif;
  color:var(--beige);font-size:16px;margin-bottom:3px}
.jk{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--salmon)}
.jtitle{font-family:"Noto Serif TC",serif;font-size:18px;margin-top:3px}.jdesc{font-size:12px;line-height:1.65;
  color:var(--b-70);margin-top:5px}
.jthemes{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}.jthemes span{font-size:9.5px;color:var(--b-50);
  border:.5px solid var(--b-10);border-radius:99px;padding:3px 7px}
.jfoot{display:flex;align-items:center;gap:10px;margin-top:10px}.jcount{font-family:var(--mono);font-size:10px;
  color:var(--b-50);white-space:nowrap}.jcount b{font-size:18px;color:var(--beige);margin-right:3px}
.jopen{margin-left:auto;background:var(--salmon);color:var(--navy);border-radius:var(--r);padding:9px 14px;
  font-size:12px;font-weight:700}.jopen:active{background:#F0BAAD}

.gstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-bottom:16px}
.gstat div{border:.5px solid var(--b-10);border-radius:var(--r);padding:11px 12px 12px}
.gstat .k{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--b-50)}
.gstat .v{font-family:var(--mono);font-size:18px;font-weight:500;margin-top:4px;line-height:1}
.gstat .v small{font-size:11px;color:var(--b-34);font-weight:400;letter-spacing:.04em}

.gchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:16px;scrollbar-width:none}
.gchips::-webkit-scrollbar{display:none}
.gchip{flex:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;padding:0 14px;
  border:.5px solid var(--b-18);border-radius:99px;color:var(--b-50);height:34px;
  display:flex;align-items:center;transition:background .16s}
.gchip[aria-pressed="true"]{background:var(--beige);border-color:var(--beige);color:var(--navy);font-weight:500}

.gsec{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.gsec .nm{font-family:"Noto Serif TC",serif;font-size:13px;color:var(--b-70)}
.gsec .bar{flex:1;height:1px;background:var(--b-10)}
.gsec .bar i{display:block;height:100%;transition:width .4s}
.gsec .ct{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--b-50)}

.gg{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.gc{aspect-ratio:.72;border-radius:3px;border:.5px solid var(--b-18);position:relative;
  display:flex;align-items:center;justify-content:center;transition:transform .12s}
.gc:active{transform:scale(.93)}
.gc .n{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--b-34)}
.gc svg{width:15px;height:15px;color:var(--b-34)}
.gc::after{content:"";position:absolute;inset:3px;border:.5px solid var(--b-10);border-radius:1px}
.gc.st-approved{border-color:transparent}
.gc.st-approved .n,.gc.st-approved svg{color:var(--navy)}
.gc.st-approved::after{border-color:rgba(19,27,46,.16)}
.gc.st-pending .n,.gc.st-pending svg{color:var(--b-50)}
.gc.movie{border-color:rgba(201,162,39,.55)}
.gc.movie svg{color:rgba(201,162,39,.85)}
.gc.trial{border-color:rgba(196,69,43,.55)}
.gc.trial svg{color:rgba(196,69,43,.9)}
.gc.movie.st-approved,.gc.trial.st-approved{border-color:transparent}
.gc.movie.st-approved svg,.gc.trial.st-approved svg{color:var(--navy)}
.gc.cur{box-shadow:0 0 0 1px var(--salmon)}
.gempty{font-size:13px;color:var(--b-34);padding:26px 0;text-align:center}

.toast{position:absolute;left:50%;bottom:calc(106px + var(--sb));transform:translateX(-50%) translateY(6px);
  background:var(--beige);color:var(--navy);font-size:12.5px;letter-spacing:.04em;padding:9px 18px;
  border-radius:99px;opacity:0;pointer-events:none;transition:.28s;z-index:85;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;
    animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="app" id="app">
  <span class="bk tl"></span><span class="bk tr"></span><span class="bk bl"></span><span class="bk br"></span>

  <div class="top">
    <span class="uc-logo">uc</span>
    <button class="rv" id="rv"></button>
    <button class="sync" id="sync" data-s="off" aria-label="連結或檢查試算表"></button>
    <span class="ct">翻開 <b id="cDone">0</b> / <span id="cAll">0</span></span>
    <button class="icb" id="toGrid" aria-label="全覽">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
  </div>

  <div class="segwrap" id="segwrap">
    <div class="segs" id="segs"></div>
    <span class="segcur" id="segCur"></span>
  </div>

  <div class="theme" id="theme">
    <div class="mod" id="tMod"></div>
    <h1 id="tName"></h1>
  </div>

  <div class="stage" id="stage"><div class="deck" id="deck"></div></div>

  <div class="meta">
    <div class="g" id="mTitle"></div>
    <div class="s" id="mState"></div>
  </div>

  <div class="acts">
    <button class="btn sq" id="sortBtn" data-mode="seq" aria-label="切換為隨機洗牌">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.7" stroke-linejoin="round">
        <rect class="r1" x="3.5" y="5" width="10" height="14" rx="1.5"/>
        <rect class="r2" x="10.5" y="5" width="10" height="14" rx="1.5"/>
      </svg>
    </button>
    <button class="btn pri" id="act">填寫卡片</button>
  </div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <div class="inner" id="sinner"></div>
    <div class="wfoot">
      <button class="btn sq" id="sClose" aria-label="關閉">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button class="btn" id="sEdit" style="flex:1;display:none">我想再修改</button>
      <button class="btn pri" id="sSave">完成，收進牌組</button>
    </div>
    <div class="stamp" id="stamp"><span id="stampTx">已收進牌組</span></div>
  </div>

  <div class="grid" id="grid" role="dialog" aria-modal="true" aria-labelledby="gTitle">
    <div class="gh">
      <button class="icb" id="gClose" aria-label="返回">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 id="gTitle">整副牌</h2>
      <button class="lnk" id="setApi">連結試算表</button>
      <span class="gtot" id="gTot"></span>
    </div>
    <div class="journey" id="journey">
      <p class="jhint">點選旅人的道具探索卡片，點旅人查看全部</p>

："}},{"id":47,"group":"社交故事庫","name":"社交故事庫 20","scaffold":{"title":"✍️ 社交故事庫盤點 ── 寫下值得分享的故事","tips":["請寫下可以幫助別人快速認識你的人生故事，寫下吸引人的頭條式標題即可！","📌 **【重要備註】**：在此階段先進行初步故事盤點，之後會再帶領學員補充細節。"],"placeholder":"故事標題：\n發生了什麼（先寫幾個關鍵字即可）：\n我為什麼想把它分享給別人："}},{"id":48,"group":"興趣與技能盤點","name":"一直想做的事 01","scaffold":{"title":"🎨 興趣與技能 ── 一直想做但還沒做過的事 01","tips":["有沒有一件事，你已經想過很多次，卻一直還沒有真的開始？","先不用考慮時間、能力或最後會不會完成，寫下第一個浮現的答案，以及你為什麼一直記得它。"],"placeholder":"一直想做的事：\n我為什麼會想到它："}},{"id":49,"group":"興趣與技能盤點","name":"一直想做的事 02","scaffold":{"title":"🎨 興趣與技能 ── 一直想做但還沒做過的事 02","tips":["再想一件你曾經說過「有一天一定要試試看」，但目前還沒做過的事。","不需要先做承諾，這張卡只是幫你把埋在心裡的念頭找回來。"],"placeholder":"一直想做的事：\n我為什麼會想到它："}},{"id":50,"group":"興趣與技能盤點","name":"想找人一起做的事 01","scaffold":{"title":"🎨 興趣與技能 ── 想找人一起做的事 01","tips":["有什麼事是你一個人不太會開始，但如果有人同行，就會很想參加？","可以是活動、運動、旅行、課程，或任何需要一點陪伴才更有趣的體驗。"],"placeholder":"想找人一起做的事：\n希望和什麼樣的人一起：\n為什麼想一起做："}},{"id":51,"group":"興趣與技能盤點","name":"想找人一起做的事 02","scaffold":{"title":"🎨 興趣與技能 ── 想找人一起做的事 02","tips":["再想一件如果朋友現在約你，你很可能會答應的事。","重點不是找到正確答案，而是看見哪些體驗會讓你期待與人共享。"],"placeholder":"想找人一起做的事：\n希望和什麼樣的人一起：\n為什麼想一起做："}},{"id":52,"group":"興趣與技能盤點","name":"我最擅長的事 01","scaffold":{"title":"🎨 興趣與技能 ── 我最擅長、也能教別人的事 01","tips":["有什麼事是你做得很熟、很有心得，甚至可以帶一個沒有經驗的人入門？","不一定是專業技能；料理、整理、選店、遊戲或生活小技巧都可以。"],"placeholder":"我擅長的事：\n我可以怎麼帶一個新手入門："}},{"id":53,"group":"興趣與技能盤點","name":"我最擅長的事 02","scaffold":{"title":"🎨 興趣與技能 ── 我最擅長、也能教別人的事 02","tips":["再想一件別人曾經請教你，或你做起來比身邊的人更順手的事。","不用證明自己是專家，只要你願意分享方法，就值得記下來。"],"placeholder":"我擅長的事：\n別人曾經怎麼請教我：\n我會怎麼教："}},{"id":54,"group":"興趣與技能盤點","name":"想學會的東西 01","scaffold":{"title":"🎨 興趣與技能 ── 想學會的東西 01","tips":["有什麼東西是你現在還不會，但看到別人會時，心裡會覺得很羨慕或很想試？","寫下你想學會的東西，以及學會後最想拿它來做什麼。"],"placeholder":"想學會的東西：\n學會後最想拿來做什麼："}},{"id":55,"group":"興趣與技能盤點","name":"想學會的東西 02","scaffold":{"title":"🎨 興趣與技能 ── 想學會的東西 02","tips":["再想一項如果有人願意帶你入門，你會想認真學看看的東西。","可以先從好奇開始，不需要現在就知道自己會不會長期投入。"],"placeholder":"想學會的東西：\n我對它好奇的地方：\n我想怎麼開始："}},{"id":56,"group":"興趣與技能盤點","name":"最近流行什麼 01","scaffold":{"title":"🎨 興趣與技能 ── 你發現最近流行什麼？01","tips":["最近在朋友、社群或生活中，有什麼東西突然很常被提到？","先寫下你觀察到的流行，不需要確定自己喜不喜歡；也可以補上你對它的第一印象。"],"placeholder":"我發現最近流行：\n我是從哪裡注意到的：\n我的第一印象："}},{"id":57,"group":"興趣與技能盤點","name":"最近流行什麼 02","scaffold":{"title":"🎨 興趣與技能 ── 你發現最近流行什麼？02","tips":["再想一個最近常看到、常聽到，或身邊有人正在參與的新話題、新活動或新事物。","重點是練習留意身邊正在發生什麼，也替未來的聊天多存一個話題。"],"placeholder":"我發現最近流行：\n我是從哪裡注意到的：\n我會想了解或嘗試嗎："}},{"id":58,"group":"地點收藏","name":"放鬆耍廢的地方 01","scaffold":{"title":"📍 地點收藏 ── 放鬆耍廢的地方 01","tips":["想一個讓你可以放慢速度、不必安排太多事情的地方。去過或想去都可以。","請記下地點名稱、地標網址，以及它為什麼適合放鬆耍廢。"],"placeholder":"地點名稱：\n地標網址：\n為什麼適合放鬆耍廢："}},{"id":59,"group":"地點收藏","name":"放鬆耍廢的地方 02","scaffold":{"title":"📍 地點收藏 ── 放鬆耍廢的地方 02","tips":["再收藏一個你累的時候會想去，或光想到就覺得可以喘口氣的地方。","請記下地點名稱、地標網址，以及你喜歡那裡的原因。"],"placeholder":"地點名稱：\n地標網址：\n我喜歡那裡的原因："}},{"id":60,"group":"地點收藏","name":"下雨也能去的地方 01","scaffold":{"title":"📍 地點收藏 ── 下雨也能去的地方 01","tips":["想一個天氣不好時仍然方便前往，也不會讓行程大受影響的地方。","請記下地點名稱、地標網址，以及它適合雨天的原因。"],"placeholder":"地點名稱：\n地標網址：\n為什麼適合下雨天："}},{"id":61,"group":"地點收藏","name":"下雨也能去的地方 02","scaffold":{"title":"📍 地點收藏 ── 下雨也能去的地方 02","tips":["再準備一個雨天備案，可以是室內景點、餐廳、展覽或任何你覺得舒服的空間。","請記下地點名稱、地標網址，以及你會怎麼安排。"],"placeholder":"地點名稱：\n地標網址：\n雨天可以怎麼安排："}},{"id":62,"group":"地點收藏","name":"最喜歡的餐廳 01","scaffold":{"title":"📍 地點收藏 ── 最喜歡的餐廳 01","tips":["想一家你真心喜歡，也會願意推薦給別人的餐廳。","請記下餐廳名稱、地標網址，以及你最喜歡它的原因或必點的東西。"],"placeholder":"餐廳名稱：\n地標網址：\n我最喜歡的原因／必點："}},{"id":63,"group":"地點收藏","name":"最喜歡的餐廳 02","scaffold":{"title":"📍 地點收藏 ── 最喜歡的餐廳 02","tips":["再收藏一家你吃過還會想再去，或很想帶別人一起去的餐廳。","請記下餐廳名稱、地標網址，以及它最吸引你的地方。"],"placeholder":"餐廳名稱：\n地標網址：\n它最吸引我的地方："}},{"id":64,"group":"地點收藏","name":"適合約會的地方 01","scaffold":{"title":"📍 地點收藏 ── 適合約會的地方 01","tips":["想一個適合兩個人相處、聊天或一起體驗事情的地方。","請記下地點名稱、地標網址，以及它為什麼適合約會。"],"placeholder":"地點名稱：\n地標網址：\n為什麼適合約會："}},{"id":65,"group":"地點收藏","name":"適合約會的地方 02","scaffold":{"title":"📍 地點收藏 ── 適合約會的地方 02","tips":["再收藏一個能自然創造互動、留下共同回憶的約會地點。","請記下地點名稱、地標網址，以及你想像中的相處方式。"],"placeholder":"地點名稱：\n地標網址：\n我想像可以一起做什麼："}},{"id":66,"group":"地點收藏","name":"有回憶的地方 01","scaffold":{"title":"📍 地點收藏 ── 你有回憶的地方 01","tips":["有沒有一個地方，只要想到它，就會連帶想起一段經歷或某個時期的自己？","請記下地點名稱、地標網址，以及你和這個地方之間的回憶。"],"placeholder":"地點名稱：\n地標網址：\n我和這個地方的回憶："}},{"id":67,"group":"地點收藏","name":"有回憶的地方 02","scaffold":{"title":"📍 地點收藏 ── 你有回憶的地方 02","tips":["再想一個承載著家人、朋友、感情或人生階段回憶的地方。","請記下地點名稱、地標網址，以及那段回憶為什麼對你重要。"],"placeholder":"地點名稱：\n地標網址：\n這段回憶為什麼對我重要："}}],"movies":[{"title":"🎬 愛在黎明破曉時 (Before Sunrise)","desc":"「我相信如果世上真的有神，神不會在你我身上，而是在我們之間的這點空間裡。」\u003cbr>\u003cbr>【啟發】：展現脆弱性、深度對話的藝術、專注當下的互動。"},{"title":"🎬 真愛每一天 (About Time)","desc":"「生活是一連串的選擇，而最重要的是你選擇了誰陪你一起度過。」\u003cbr>\u003cbr>【啟發】：接受約會中的不完美、專注當下的心態、長期關係的平淡與幸福。"},{"title":"🎬 我的失憶女友 (50 First Dates)","desc":"「沒關係，我明天會再讓你愛上我一次。」\u003cbr>\u003cbr>【啟發】：長期關係的經營（愛是每天的選擇與行動，不是一次性的追求）。"},{"title":"🎬 全民情聖 (Hitch)","desc":"「人生的意義不在於你呼吸了多少次，而在於那些讓你無法呼吸的瞬間。」\u003cbr>\u003cbr>【啟發】：打破招式迷思（真誠勝過套路）、創造張力與情緒波動、約會的基本自信心態。"},{"title":"🎬 我們的愛情一言難盡 (Newness)","desc":"「我們都有缺陷，但最難的是找到一個願意看著你的缺陷不逃跑的人。」\u003cbr>\u003cbr>【啟發】：現代交友軟體的焦慮、親密關係中的陰暗面與接納、進入長期穩定關係的真實代價。"},{"title":"🎬 戀夏500日 (500 Days of Summer)","desc":"「不要因為某個女孩喜歡和你一樣奇怪的東西，就認定她是你的靈魂伴侶。」\u003cbr>\u003cbr>【啟發】：破除真命天女症、區分「想像」與「真實」、失戀後的重建與成長。"},{"title":"🎬 派特的幸福劇本 (Silver Linings Playbook)","desc":"「愛就是找到那個即使看穿了你的破碎，依然覺得你美麗的人。」\u003cbr>\u003cbr>【啟發】：展現真實自我、接納脆弱、共同成長與互相治癒。"},{"title":"🎬 雲端情人 (Her)","desc":"「謝謝你教會我如何去愛，因為你，我才成為現在的我。」\u003cbr>\u003cbr>【啟發】：情緒價值與共鳴、處理孤獨感、理解親密關係的本質。"},{"title":"🎬 真愛挑日子 (One Day)","desc":"「只要你還願意對我笑，我就覺得這世界還不算太糟。」\u003cbr>\u003cbr>【啟發】：時機（Timing）的重要性、從朋友到戀人的界線、把握當下不留遺憾。"},{"title":"🎬 樂來越愛你 (La La Land)","desc":"「有些人走進你的生命，是為了幫助你成為更好的自己，而不是為了永遠留下。」\u003cbr>\u003cbr>【啟發】：自我價值與關係的平衡、成熟地看待分手、感謝過去的戀情。"},{"title":"🎬 王牌冤家 (Eternal Sunshine of the Spotless Mind)","desc":"「如果你可以把某個人從記憶中抹去，這是否意味著你從未愛過他？」\u003cbr>\u003cbr>【啟發】：面對失戀的痛苦、成長需要接納受傷、勇敢去愛的本質。"},{"title":"🎬 手札情緣 (The Notebook)","desc":"「我不是什麼大人物，只是個凡人。但我全心全意地愛過另一個人，對我而言，這就足夠了。」\u003cbr>\u003cbr>【啟發】：長期關係的承諾、克服現實阻礙、純粹的激情與付出。"},{"title":"🎬 熟男型不型 (Crazy, Stupid, Love)","desc":"「女人是會被傾聽者吸引的。」\u003cbr>\u003cbr>【啟發】：自然展現個人魅力與自信、招式與真誠的平衡、破除「靈魂伴侶」的浪漫迷思。"},{"title":"🎬 曼哈頓戀習曲 (Begin Again)","desc":"「我們都是迷失的星星，試圖點亮黑暗。」\u003cbr>\u003cbr>【啟發】：失戀的修復、找回自己的熱情與生活重心、不強求結果的關係。"},{"title":"🎬 新娘百分百 (Notting Hill)","desc":"「你不可能永遠躲在電影的幻想裡，有時候你必須勇敢面對現實的愛情。」\u003cbr>\u003cbr>【啟發】：剝除對方的身分光環、真誠展現脆弱、勇敢爭取所愛。"},{"title":"🎬 鐵達尼號 (Titanic)","desc":"「贏得這張船票，是我一生中最美好的事，因為它讓我遇見了妳。」\u003cbr>\u003cbr>【啟發】：突破世俗眼光、愛情帶來的自我覺醒、讓每一天都過得有意義。"},{"title":"🎬 傲慢與偏見 (Pride & Prejudice)","desc":"「我們的傲慢與偏見，差點讓我們錯過了彼此。」\u003cbr>\u003cbr>【啟發】：放下防備機制、不以第一印象評斷人、在關係中承認自己的錯誤。"},{"title":"🎬 愛在日落巴黎時 (Before Sunset)","desc":"「即使只是和你坐在一起聊天，也比世界上任何事情都來得有意義。」\u003cbr>\u003cbr>【啟發】：成熟的情感交流、面對遺憾與現實、高質量的思想碰撞與吸引。"},{"title":"🎬 愛情藥不藥 (Love & Other Drugs)","desc":"「我愛你，不是因為你完美，而是儘管你不完美，我依然選擇你。」\u003cbr>\u003cbr>【啟發】：從外在吸引過渡到深層羈絆、接納伴侶的缺陷與脆弱、親密關係中的責任感。"},{"title":"🎬 P.S. 我愛你 (P.S. I Love You)","desc":"「留住愛最美的方式，是讓自己勇敢迎向沒有我的明天。」\u003cbr>\u003cbr>【啟發】：告別過往悲傷、勇敢重拾愛人的能力、學會放手與祝福。"}],"trials":[{"title":"🎯 她說：不要只回安安你好","desc":"剛配對成功，你會怎麼從她願意公開的資訊開始一段自然對話？","concept":"UC 概念｜好奇心","insight":"從對方願意公開的細節出發，不是查戶口，而是真心想了解她為什麼喜歡那件事。"},{"title":"🎯 她笑你：看起來很像玩咖","desc":"面對半開玩笑的試探，你會急著證明自己，還是照顧彼此與當下的氣氛？","concept":"UC 概念｜真誠","insight":"真誠不是急著證明自己，也不是迎合對方；它同時在乎自己、對方與當下情境。"},{"title":"🎯 她說：我們還不熟","desc":"邀請被婉拒時，你能尊重她的節奏，也保留自然認識彼此的空間嗎？","concept":"UC 概念｜尊重意願","insight":"邀請不是要求。聽見對方的猶豫，就把選擇權還給她；尊重拒絕，關係才有安全感。"},{"title":"🎯 她只回：哈哈、是喔、對啊","desc":"當互動明顯降溫時，你會繼續硬聊、過度解讀，還是先看懂當下的訊號？","concept":"UC 概念｜焦點在外","insight":"焦點在外，是看見對方此刻還有沒有互動意願；不勉強延續，也不急著把冷淡解讀成否定自己。"},{"title":"🎯 她半天才回一次訊息","desc":"回覆速度不同時，你會跟著焦慮、刻意計時，還是維持自己的生活節奏？","concept":"UC 概念｜結果不等於我","insight":"回覆速度是一個結果，不等於你的價值。照自己的生活節奏真誠回應，不用靠秒回或故意拖延證明什麼。"},{"title":"🎯 她開始抱怨前任","desc":"她需要被理解時，你能傾聽她的感受，同時守住自己的界線嗎？","concept":"UC 概念｜主動聆聽","insight":"主動聆聽不是搶著評理，也不是一起攻擊別人；先聽懂感受，再用好奇心與同理陪她把話說完。"},{"title":"🎯 她在見面前一天臨時取消","desc":"期待落空時，你能說出自己的感受，也不把失望變成對對方的壓力嗎？","concept":"UC 概念｜同理與界線","insight":"你可以失望，也可以體諒對方。先確認她的狀況，再讓下一次安排由雙方共同決定。"},{"title":"🎯 她消失幾天後又說早安","desc":"面對忽冷忽熱的互動，你會報復、假裝沒感覺，還是穩定而坦白地回應？","concept":"UC 概念｜情緒穩定","insight":"情緒穩定不是裝作不在乎，而是先照顧自己的感受，再用不指責、不報復的方式回到對話。"},{"title":"🎯 條件都不錯，為什麼還是沒有心動？","desc":"當條件介紹取代了真正的交流，你能辨認什麼才會讓兩個人產生連結嗎？","concept":"UC 概念｜情緒價值","insight":"條件只能介紹一個人，互動中的理解、感受與共鳴，才會讓對方真正感覺和你在一起。"},{"title":"🎯 在聚會裡，你想認識一個人","desc":"第一句話不需要表演厲害；你能帶著真誠與尊重，讓認識彼此自然開始嗎？","concept":"UC 概念｜交朋友","insight":"交朋友不是收集聯絡方式，也不是把對方當練習對象；它只是帶著欣賞、分寸與尊重，真誠地認識一個人。"},{"title":"🎯 你想說實話，又怕讓她不舒服","desc":"同時在乎自己、對方與當下情境時，你會怎麼把真實的感受說出來？","concept":"UC 概念｜真誠三在乎","insight":"真誠同時照顧三件事：我的感受、對方的感受，以及當下的情境。只顧一邊，都可能變成壓抑、討好或傷人。"},{"title":"🎯 想邀她見面，又不想造成壓力","desc":"你能清楚表達自己的邀請，同時讓對方保有舒服說好或拒絕的空間嗎？","concept":"UC 概念｜好感測試","insight":"好感測試是發出一個可以被拒絕的邀請，觀察對方的回應；反應不好就停，反應好才一起往前。"},{"title":"🎯 她說最近迷上陶藝","desc":"你會把聊天變成身家調查，還是沿著她真正有感覺的地方繼續認識她？","concept":"UC 概念｜好奇心","insight":"好奇心關心的是對方怎麼想、為什麼喜歡，而不是急著蒐集資料或把話題拉回自己身上。"},{"title":"🎯 從穿搭開啟話題","desc":"你能用觀察提出一個允許對方修正的猜測，而不是替她貼上標籤嗎？","concept":"UC 概念｜冷讀","insight":"冷讀不是猜得準，而是用觀察與人的兩面性切入，讓對方有空間補充、修正，進而更容易了解彼此。"},{"title":"🎯 她有點冷淡，是討厭你嗎？","desc":"資訊還不夠時，你會急著替她下結論，還是保持開放並尊重她的互動節奏？","concept":"UC 概念｜開放","insight":"開放是不急著貼標籤或腦補原因。保有自己的感受與界線，也讓對方真實的樣子慢慢出現。"}],"quiz":[{"scenario":"1. 剛配對成功，對方自介特別註明「不要只回安安你好」。你會怎麼開始？","options":[{"text":"A. 「安安你好，我偏要這樣說哈哈哈。」","isCorrect":false,"feedback":"把她寫下的界線當成玩笑，容易讓人感覺沒有被尊重。"},{"text":"B. 「妳看起來很有氣質，平常週末都在做什麼？」","isCorrect":false,"feedback":"稱讚較籠統，後面的問題也很容易變成制式問答。"},{"text":"C. 「看到妳有張照片是在冰島拍的，那邊的極光現場真的有照片那麼誇張嗎？」","isCorrect":true,"feedback":"從她願意公開的細節出發，帶著好奇心開啟一個她可能有感覺的話題。"},{"text":"D. 「妳的自介滿有趣的，想跟妳聊聊。」","isCorrect":false,"feedback":"態度友善，但缺少能讓對方接著回應的具體內容。"}]},{"scenario":"2. 聊天氣氛不錯時，她半開玩笑地說：「你照片看起來很像玩咖耶，應該很有經驗吧？」","options":[{"text":"A. 「哪有！我真的很乖，不信妳可以去問我朋友。」","isCorrect":false,"feedback":"急著證明自己，反而會讓對話變得緊張。"},{"text":"B. 「被妳發現了，我週末都在各大公園玩溜滑梯，資歷很完整。」","isCorrect":true,"feedback":"用輕鬆幽默接住玩笑，不急著自我辯護，也沒有攻擊對方。"},{"text":"C. 「對啊，我認識過很多女生，但妳確實滿特別的。」","isCorrect":false,"feedback":"用經驗與比較證明自己，容易讓人感到被物化或被評分。"},{"text":"D. 「妳這樣以貌取人不太好吧？我們才剛認識。」","isCorrect":false,"feedback":"直接進入對錯爭辯，會把原本輕鬆的互動變成防衛。"}]},{"scenario":"3. 聊了幾天後你提出邀請，她說：「我們還不熟耶，還是再聊聊看？」","options":[{"text":"A. 「見面聊不是比較快熟嗎？」","isCorrect":false,"feedback":"試圖說服她改變感受，可能讓邀請變成壓力。"},{"text":"B. 「那妳覺得要聊多久才算熟？下個月可以嗎？」","isCorrect":false,"feedback":"持續追問時間點，仍然沒有真正回應她的猶豫。"},{"text":"C. 「好吧，那就算了。」","isCorrect":false,"feedback":"把失望直接丟回對方，容易讓人感到有情緒壓力。"},{"text":"D. 「沒問題，我們就照彼此舒服的節奏慢慢聊；等妳也覺得適合時再說。」","isCorrect":true,"feedback":"尊重她現在的意願，也保留之後自然發展的空間。"}]},{"scenario":"4. 她連續幾次只回「哈哈」「是喔」「對啊」，互動明顯不像前面那麼投入。你會怎麼做？","options":[{"text":"A. 「感覺妳現在可能不太方便聊，我們改天再聊～」","isCorrect":true,"feedback":"看見當下的互動訊號，輕鬆收尾，也把空間還給對方。"},{"text":"B. 「妳是不是心情不好？還是工作太累？」","isCorrect":false,"feedback":"可能猜得太快；對方也可能只是在忙，或此刻沒有聊天心情。"},{"text":"C. 立刻換一個更刺激的新話題，希望把氣氛救回來。","isCorrect":false,"feedback":"繼續用力推進，可能忽略她正在降低互動的訊號。"},{"text":"D. 「妳是不是不想跟我聊天？」","isCorrect":false,"feedback":"要求對方立刻解釋，容易增加不必要的壓力。"}]},{"scenario":"5. 剛加聯絡方式時，她大約半天回覆一次。你的回覆節奏會怎麼安排？","options":[{"text":"A. 不管她多久回，我都維持秒回，才顯得有誠意。","isCorrect":false,"feedback":"如果為了證明誠意而打亂自己的生活，互動容易累積焦慮。"},{"text":"B. 她隔十二小時回，我也一定隔十二小時再回。","isCorrect":false,"feedback":"刻意計時是在控制表現，不是真實的生活節奏。"},{"text":"C. 有空、想回時就自然回覆；不用秒回，也不用故意拖延。","isCorrect":true,"feedback":"維持自己的生活，同時真誠回應當下，是比較穩定的互動節奏。"},{"text":"D. 故意放兩天不回，讓她體會等待的感覺。","isCorrect":false,"feedback":"用延遲作為報復或測試，會讓互動走向操控。"}]},{"scenario":"6. 她開始談起前任，說那段關係讓她很受傷。你會怎麼回應？","options":[{"text":"A. 「那種人真的很糟，妳早就應該離開他了。」","isCorrect":false,"feedback":"跟著批判前任，未必能真正理解她此刻的感受。"},{"text":"B. 「聽起來那段時間真的很辛苦。妳現在回頭看，最難受的是哪一部分？」","isCorrect":true,"feedback":"先接住感受，再帶著好奇心聆聽；不搶著評理，也不把自己變成比較對象。"},{"text":"C. 「其實妳當時也有不對的地方，應該早點溝通。」","isCorrect":false,"feedback":"在對方還需要被理解時急著分析，容易中斷情緒連結。"},{"text":"D. 「如果是我，我一定不會這樣對妳。」","isCorrect":false,"feedback":"把她的故事轉成自己的表現機會，焦點就離開了她。"}]},{"scenario":"7. 約好週末見面，她在前一天說：「抱歉，明天臨時要加班，得先取消。」","options":[{"text":"A. 「喔，好。」","isCorrect":false,"feedback":"如果心裡其實失望，過度簡短可能讓情緒以冷淡的方式跑出來。"},{"text":"B. 「太可惜了，我原本超級期待，餐廳都訂好了。」","isCorrect":false,"feedback":"只強調自己的付出，可能讓對方感到被要求補償。"},{"text":"C. 「那下週六呢？還是週日？妳哪天可以？」","isCorrect":false,"feedback":"立刻要求新時間，可能沒有先照顧她當下的狀況。"},{"text":"D. 「辛苦了，妳先把工作處理好。等妳   '<path d="M98 7.5c4-4.5 10-4.5 14 0-4 4.5-10 4.5-14 0z" fill="currentColor" fill-opacity=".32" stroke="currentColor" stroke-width=".8"/>' +
  '<path d="M98 288.5c4-4.5 10-4.5 14 0-4 4.5-10 4.5-14 0z" fill="currentColor" fill-opacity=".32" stroke="currentColor" stroke-width=".8"/>' +
  '</svg>';

/* 火焰：沿上下邊各排一串舌狀曲線，高度不等才像火 */
function flamePath(y, dir, lift){
  const x0 = 7.5, w = 197, n = 9, s = w / n;
  const hs = [11, 16, 12, 18, 13, 17, 11, 15, 12];
  let d = 'M' + x0 + ' ' + y;
  for (let i = 0; i < n; i++) {
    const x = x0 + s * i, hh = (hs[i] + (lift || 0)) * dir;
    d += ' Q' + (x + s * .18).toFixed(1) + ' ' + (y - hh).toFixed(1) +
         ' ' + (x + s * .5).toFixed(1) + ' ' + (y - hh * .58).toFixed(1) +
         ' Q' + (x + s * .82).toFixed(1) + ' ' + (y - hh * .12).toFixed(1) +
         ' ' + (x + s).toFixed(1) + ' ' + y;
  }
  return d;
}

const FLAME = '<svg class="deco" viewBox="0 0 212 296" fill="none" aria-hidden="true">' +
  '<rect x="7.5" y="7.5" width="197" height="281" rx="3" stroke="currentColor" stroke-width=".9" opacity=".4"/>' +
  '<path d="' + flamePath(288.5, 1, 0) + '" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>' +
  '<path d="' + flamePath(7.5, -1, 0) + '" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>' +
  '<path d="' + flamePath(285, 1, -5) + '" stroke="#E8A898" stroke-width=".85" opacity=".75" stroke-linejoin="round"/>' +
  '<path d="' + flamePath(11, -1, -5) + '" stroke="#E8A898" stroke-width=".85" opacity=".75" stroke-linejoin="round"/>' +
  '</svg>';
const G_TRIAL = 'M12 3l7 4v6c0 4-3 6.5-7 8-4-1.5-7-4-7-8V7z';

const clean = s => s.replace(/^[\u{1F300}-\u{1FAFF}☀-➿]\s*/u, '');
const strip = s => s.replace(/\*\*(.+?)\*\*/g, '$1');
const attr = s => String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

/* ── 組牌：每兩張故事卡插一張換氣卡，兩種牌序共用 ── */
const THEMES = DATA.groups.map(g => g.group);
const themeIdx = g => THEMES.indexOf(g);

const MOVIES = DATA.movies.map((m, mi) => {
  const p = (m.desc || '').split('<br><br>');
  const full = clean(m.title);
  const mt = full.match(/^(.+?)\s*[（(](.+)[）)]\s*$/);
  return { type:'movie', seq:String(mi + 1).padStart(2,'0'), title:mt ? mt[1] : full,
    en:mt ? mt[2] : '', quote:p[0]||'', ins:(p[1]||'').replace('【啟發】：','') };
});
const TRIALS = DATA.trials.map((t, i) =>
  ({ type:'trial', title:clean(t.title), seq:String(i + 1).padStart(2,'0'),
     desc:t.desc, concept:t.concept, insight:t.insight, quiz:DATA.quiz[i] }));

const shuffled = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

/* mix=false → 課程順序；mix=true → 打亂，但換氣卡仍每兩張穿插一次 */
function buildDeck(mix){
  const stories = DATA.assignments.map(a =>
    ({ type:'write', group:a.group, id:a.id, title:a.name, scaffold:a.scaffold }));
  const st = mix ? shuffled(stories) : stories;
  const mv = mix ? shuffled(MOVIES) : MOVIES;
  const tr = mix ? shuffled(TRIALS) : TRIALS;
  const out = [];
  let mi = 0, ci = 0, w = 0, lastG = THEMES[0];
  const take = (src, g) => { if (!src.group) src.group = g; return { ...src }; };
  const pushBreak = g => {
    if ((mi + ci) % 2 === 0 && mi < mv.length) out.push(take(mv[mi++], g));
    else if (ci < tr.length) out.push(take(tr[ci++], g));
    else if (mi < mv.length) out.push(take(mv[mi++], g));
  };
  st.forEach(s => { out.push(s); lastG = s.group; if (++w % 2 === 0) pushBreak(lastG); });
  while (mi < mv.length || ci < tr.length) pushBreak(lastG);
  return out;
}
let DECK = buildDeck(false);
let seqMode = true;

/* ── 狀態 ── */
/* ══ 同步層 ══ 規格見 docs/SYNC_SPEC.md
   本地永遠是第一寫入點：打字即存、送出樂觀更新、背景才發網路。
   尚未連結試算表時整套照常運作，只是東西一直留在 outbox。
   ponytail: outbox 用陣列循序送，同一張卡以卡號去重。
   天花板＝大量離線累積時是序列送出；升級路徑＝改批次寫入。 */
const LS = {
  get(k, d){ try { const v = localStorage.getItem('uc.' + k); return v === null ? d : JSON.parse(v); }
    catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem('uc.' + k, JSON.stringify(v)); } catch (e) {} }
};
/* 端點是教練部署一次的中央 GAS，學員只要貼自己的試算表連結。
   ponytail: 端點用網址參數覆寫再存起來，省掉另做設定頁。
   天花板＝換端點要重發一次帶參數的連結；升級路徑＝做一個真正的設定畫面。 */
const GAS_DEFAULT = 'https://script.google.com/macros/s/AKfycbyOjWEbT0jjI1D_5H38Fy4kbGHW1RtXvJwluLVJKf2hsOfRZS3irjWI7oHtvoi5L-xQ/exec';
const qs = new URLSearchParams(location.search);
const hs = new URLSearchParams(location.hash.replace(/^#/, ''));
let GAS = qs.get('gas') || hs.get('gas') || LS.get('gas', GAS_DEFAULT);
if (GAS) LS.set('gas', GAS);
let SHEET = sheetId(qs.get('sheet') || hs.get('sheet') || '') || LS.get('sheet', '');
if (SHEET) LS.set('sheet', SHEET);

/* 從整條 Google 試算表網址裡挖出 ID，直接貼 ID 也接受 */
function sheetId(v){
  const s = String(v || '').trim();
  if (!s) return '';
  const m = s.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]{20,})/);
  if (m) return m[1];
  return /^[a-zA-Z0-9-_]{20,}$/.test(s) ? s : '';
}
const linked = () => !!(GAS && SHEET);

const cardNo = c => c.type === 'write' ? 'STORY-' + String(c.id).padStart(2,'0')
  : c.type === 'movie' ? 'FILM-' + c.seq : 'TRIAL-' + c.seq;

/* 版本更新只遷移資料，不清除學員答案。 */
const DATA_VERSION = 3;
const PREVIOUS_VERSION = LS.get('v', 0);
let ANSWERS = LS.get('answers', null) || {};
let GRADE = LS.get('grade', null) || {};
let OUTBOX = LS.get('outbox', null) || [];
let DIRTY = LS.get('dirty', null) || {};

/* 舊版無法分辨「已同步答案」與「尚未送出的草稿」，安全起見全部先視為草稿。 */
if (PREVIOUS_VERSION < 3 && !Object.keys(DIRTY).length) {
  Object.keys(ANSWERS).forEach(no => { DIRTY[no] = Date.now(); });
}
LS.set('v', DATA_VERSION);

function persistLocal(){
  LS.set('answers', ANSWERS); LS.set('grade', GRADE); LS.set('dirty', DIRTY);
}
persistLocal();

const stateOf = c => { const g = GRADE[cardNo(c)]; return g ? g.status : 'blank'; };
const isOpen = c => stateOf(c) !== 'blank';
const isOK = c => stateOf(c) === 'approved';
const isDone = isOpen;
const queued = no => OUTBOX.some(x => x.no === no);
const hasDraft = no => !!DIRTY[no];

/* 標記完成並排入待送 */
function mark(c, patch, payload){
  const no = cardNo(c);
  GRADE[no] = Object.assign({ status:'approved', feedback:'', when:'', take:'' }, GRADE[no], patch);
  persistLocal();
  enqueue(Object.assign({ no }, payload));
}

function enqueue(item){
  OUTBOX = OUTBOX.filter(x => x.no !== item.no).concat([item]);
  LS.set('outbox', OUTBOX);
  paintSync();
  flush();
}

let syncing = false, backoff = 0, retryTimer = null, LAST_ERR = '';

/* 從 file:// 開啟時瀏覽器會擋掉跨網域請求，這是最常見的「沒反應」原因 */
const isFile = location.protocol === 'file:';

async function flush(){
  if (syncing || !OUTBOX.length || !linked() || !navigator.onLine) { paintSync(); return; }
  syncing = true; paintSync();
  try {
    while (OUTBOX.length) {
      const it = OUTBOX[0];
      const r = await fetch(GAS, { method:'POST', redirect:'follow',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ sheet: SHEET }, it)) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || '伺服器拒絕');
      if (it.action === 'submit') { delete DIRTY[it.no]; persistLocal(); }
      OUTBOX = OUTBOX.slice(1); LS.set('outbox', OUTBOX);
      paintSync(); paint();
    }
    backoff = 0;
  } catch (e) {
    LAST_ERR = '送出失敗：' + (e && e.message ? e.message : e);
    backoff = backoff ? Math.min(backoff * 4, 120000) : 2000;
    clearTimeout(retryTimer); retryTimer = setTimeout(flush, backoff);
  } finally { syncing = false; paintSync(); }
}

async function pull(){
  if (!linked() || !navigator.onLine) return;
  try {
    const url = GAS + (GAS.indexOf('?') >= 0 ? '&' : '?') +
      'sheet=' + encodeURIComponent(SHEET) + '&t=' + Date.now();
    const res = await fetch(url, { redirect:'follow' });
    const txt = await res.text();
    let j;
    try { j = JSON.parse(txt); }
    catch (e) { throw new Error('回應不是 JSON（前 80 字）：' + txt.slice(0, 80)); }
    if (!j.ok) throw new Error(j.error || '伺服器回報失敗');
    if (!Array.isArray(j.cards)) throw new Error('回應缺少 cards');
    LAST_ERR = '';
    let fresh = 0;
    j.cards.forEach(sv => {
      const was = GRADE[sv.no] ? GRADE[sv.no].status : 'blank';
      /* 本機草稿與尚未送出的內容都優先，不讓 Sheet 舊答案蓋掉。 */
      if (!hasDraft(sv.no) && !queued(sv.no) && sv.answer) ANSWERS[sv.no] = sv.answer;
      if (sv.status && sv.status !== 'blank') {
        const prev = GRADE[sv.no] || {};
        const changed = was !== sv.status || prev.feedback !== (sv.feedback || '');
        const d = new Date();
        GRADE[sv.no] = { status: sv.status, feedback: sv.feedback || '',
          /* 試算表不存評改時間，改記前端第一次看到這則回饋的日子 */
          when: changed
            ? String(d.getMonth() + 1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0')
            : (prev.when || ''),
          take: prev.take || '' };
        const newFb = sv.feedback && sv.feedback !== (prev.feedback || '');
        if (newFb || (was !== sv.status && (sv.status === 'approved' || sv.status === 'revise'))) fresh++;
      }
    });
    persistLocal(); render(); drawGrid();
    if (fresh) toast('教練回了 ' + fresh + ' 則');
  } catch (e) {
    LAST_ERR = '讀取失敗：' + (e && e.message ? e.message : e);
    paintSync();
  }
}

function paintSync(){
  const el = $('sync'); if (!el) return;
  const n = OUTBOX.length;
  const s = !linked() ? 'off' : !navigator.onLine ? 'offline'
    : syncing ? 'busy' : LAST_ERR ? 'err' : n ? 'queued' : 'ok';
  el.dataset.s = s;
  el.textContent = s === 'off' ? '未連結試算表' : s === 'offline' ? '離線'
    : s === 'busy' ? '同步中' : s === 'err' ? '同步失敗'
    : s === 'queued' ? n + ' 筆待送' : '已同步';
}

addEventListener('online', () => { paintSync(); resync(); });
addEventListener('offline', paintSync);
/* 手機瀏覽器對 visibilitychange 的支援不一，pageshow 與 focus 一起掛比較保險 */
let lastSync = 0;
function resync(){
  const t = Date.now();
  if (t - lastSync < 3000) return;   /* 同一次切換不重複打 */
  lastSync = t;
  flush(); pull();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) resync(); });
addEventListener('pageshow', resync);
addEventListener('focus', resync);

let cur = DECK.findIndex(c => !isDone(c)); if (cur < 0) cur = 0;
/* 使用者手動翻回正面的卡，記著別再自動翻過去（只在這次開啟期間有效） */
const faceUp = {};
let drag = 0, dragging = false, moved = false, intro = true, lastTheme = null;
const SPACING = 128;
const $ = id => document.getElementById(id);
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

/* ── 建牌 ── */
$('cAll').textContent = DECK.length;
let EL = [];
function mountDeck(){
$('deck').innerHTML = DECK.map((c, i) => {

    stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;

  let front, back = '';
  if (c.type === 'write') {
    front = `<div class="frame"></div>
      <span class="pip" aria-hidden="true"><span class="dash"></span><span class="alert">!</span>
        <svg class="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>
        <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6"/></svg></span>
      <div class="kind">填寫</div>
      <div class="no">${String(c.id).padStart(2,'0')}</div>
      <div class="art">${svg(GLYPH[t])}</div>

  } else if (c.type === 'movie') {
    front = `${VINE}<span class="pip"><span class="dash"></span><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6"/></svg></span>
      <div class="kind">FILM</div>

    back = `${VINE}

  } else {

      <div class="kind">TRIAL ${c.seq}</div>

      <div class="ttl">${c.title}</div>

    back = `${FLAME}
      <div class="kind">TRIAL ${c.seq}</div>

      <div class="src">${c.title}</div>`;
  }

  const label = (c.type === 'write' ? '填寫卡片 ' + c.id : c.type === 'movie' ? '知識卡 ' + c.seq : '考驗卡 ' + c.seq) + '，' + c.title;
  return `<div class="cd" data-i="${i}" role="button" tabindex="-1" aria-label="${attr(label)}" style="--h:${HUE[t]};--h-soft:${soft(HUE[t])}">
    <div class="breathe"><div class="flip">

      ${back ? `<div class="face back ${c.type}">${back}</div>` : ''}
    </div></div>
  </div>`;
}).join('');
  EL = [...document.querySelectorAll('.cd')];
}
mountDeck();

function mountSegs(){
  $('segs').innerHTML = THEMES.map((t, i) => {
    const n = DECK.filter(c => c.group === t).length;
    return `<button class="seg" data-t="${i}" style="flex:${n} 1 0" aria-label="${t}">
      <u style="background:${HUE[i]}"></u><i data-s="${i}" style="background:${HUE[i]}"></i></button>`;
  }).join('');
}
mountSegs();

/* ── 排列 ── */
function layout(){
  const pos = cur - drag;
  for (let i = 0; i < EL.length; i++) {
    const d = i - pos, ad = Math.abs(d), el = EL[i];
    if (ad > 4.2) { el.classList.add('hide'); continue; }
    el.classList.remove('hide');
    el.classList.toggle('mid', ad < .5);
    el.tabIndex = ad < .5 ? 0 : -1;
    el.setAttribute('aria-hidden', ad < .5 ? 'false' : 'true');
    const cl = Math.max(-4, Math.min(4, d));
    const x = cl * SPACING * (1 - Math.min(ad, 4) * .07);
    const z = -Math.min(ad, 4) * 120 - (intro ? 460 : 0);
    const rot = cl * -22;
    const sc = 1 - Math.min(ad, 4) * .07;
    el.style.transform = `translate3d(${x}px,${intro?26:0}px,${z}px) rotateY(${rot}deg) scale(${sc})`;
    el.style.opacity = intro ? '0' : (ad > 3.2 ? String(Math.max(0, 1 - (ad - 3.2))) : '1');
    el.style.zIndex = String(100 - Math.round(ad * 10));
    el.style.transitionDelay = intro ? '0ms' : Math.round(Math.min(ad, 4) * 45) + 'ms';
  }
}

function paint(){
  DECK.forEach((c, i) => {
    const st = stateOf(c), on = st !== 'blank';
    EL[i].classList.toggle('open', on);
    EL[i].classList.toggle('ok', st === 'approved');
    EL[i].classList.toggle('revise', st === 'revise');
    EL[i].classList.toggle('q', queued(cardNo(c)));
    EL[i].classList.toggle('fb', !!(GRADE[cardNo(c)] || {}).feedback);
    const no = cardNo(c);
    if (c.type === 'movie' && on && !faceUp[no]) EL[i].classList.add('flipped');
    if (c.type === 'trial' && on) {
      if (!faceUp[no]) EL[i].classList.add('flipped');
    }
  });
  $('cDone').textContent = DECK.filter(isDone).length;
  const rv = DECK.filter(c => stateOf(c) === 'revise').length;
  const fbOnly = DECK.filter(c => stateOf(c) !== 'revise' && (GRADE[cardNo(c)] || {}).feedback).length;
  const rvEl = $('rv');
  if (rvEl) {
    const tx = rv ? rv + ' 張待修改' : fbOnly ? fbOnly + ' 則教練留言' : '';
    rvEl.textContent = tx;
    rvEl.style.display = tx ? '' : 'none';
  }
  const curT = themeIdx(DECK[cur].group);
  THEMES.forEach((t, i) => {
    const list = DECK.filter(c => c.group === t);
    const n = list.filter(isDone).length;
    const seg = $('segs').children[i];
    const ok = list.filter(isOK).length;
    seg.querySelector('u').style.width = (n / list.length * 100) + '%';
    seg.querySelector('i').style.width = (ok / list.length * 100) + '%';
    seg.classList.toggle('now', i === curT);
    seg.classList.toggle('full', n === list.length);
    seg.style.opacity = (i === curT || n === list.length) ? '1' : '.45';
  });
  placeCursor();
}

function head(){
  const c = DECK[cur], t = themeIdx(c.group);
  if (lastTheme !== c.group) {
    $('theme').classList.add('sw');
    setTimeout(() => {
      $('tMod').textContent = DATA.groups[t].module;

const ST_LABEL = { blank:'尚未填寫', pending:'等待回饋', revise:'需要編輯', approved:'認證完成' };

    : c.type === 'movie' ? (on ? '再翻一次' : '翻開這張') : (on ? '再挑戰一次' : '挑戰');

/* 游標：標出你在整副牌的哪個位置，直接量測分段條的實際寬度，
   所以不受 gap 或比例分配影響 */
function placeCursor(){
  const c = DECK[cur], ti = themeIdx(c.group);
  const seg = $('segs').children[ti]; if (!seg) return;
  const idxs = DECK.map((x, i) => ({ x, i })).filter(o => o.x.group === c.group);
  const pos = Math.max(0, idxs.findIndex(o => o.i === cur));
  const w = $('segwrap').getBoundingClientRect(), r = seg.getBoundingClientRect();
  $('segCur').style.left = (r.left - w.left + r.width * ((pos + .5) / idxs.length)) + 'px';
}

$('segs').addEventListener('click', e => {

  const t = THEMES[+b.dataset.t];
  const first = DECK.findIndex(c => c.group === t && !isDone(c));
  const any = DECK.findIndex(c => c.group === t);

});

function render(){ layout(); paint(); head(); }
render();
requestAnimationFrame(() => {
  EL.forEach(el => el.style.transition = 'transform .72s cubic-bezier(.2,.85,.25,1),opacity .55s');
  setTimeout(() => { intro = false; layout(); }, 40);

    el.style.transition = 'transform .38s cubic-bezier(.25,.9,.3,1),opacity .3s'), 900);
});

/* ── 拖曳 ── */
const stage = $('stage');
let sx = 0, sy = 0, lastX = 0, lastT = 0, vel = 0, axis = null;
stage.addEventListener('pointerdown', e => {
  if (shuffling) return;
  dragging = true; axis = null; moved = false;
  sx = lastX = e.clientX; sy = e.clientY; lastT = performance.now(); vel = 0;
  stage.setPointerCapture(e.pointerId);
  EL.forEach(el => { el.style.transition = 'none'; el.style.transitionDelay = '0ms'; });
});
stage.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (!axis) { if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; }
  if (axis !== 'x') return;
  const now = performance.now();
  if (now - lastT > 12) { vel = (e.clientX - lastX) / (now - lastT); lastX = e.clientX; lastT = now; }
  drag = dx / SPACING; moved = true;
  const p = cur - drag, max = DECK.length - 1;
  if (p < 0) drag = cur - p * .35;
  else if (p > max) drag = cur - (max + (p - max) * .35);
  layout();
});
function endDrag(){
  if (!dragging) return;
  dragging = false;
  EL.forEach(el => el.style.transition = 'transform .38s cubic-bezier(.25,.9,.3,1),opacity .3s');
  let target = Math.round(cur - drag - vel * 3.2);
  target = Math.max(0, Math.min(DECK.length - 1, target));
  const m = target !== cur;
  cur = target; drag = 0; render();
  if (m) buzz(5);
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('click', e => {
  const c = e.target.closest('.cd'); if (!c || moved || shuffling) return;
  const i = +c.dataset.i;
  if (i === cur) doAct(); else { cur = i; render(); buzz(5); }
});
stage.addEventListener('keydown', e => {
  const c = e.target.closest('.cd');
  if (!c || +c.dataset.i !== cur || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault(); doAct();
});

function goTo(i){
  cur = Math.max(0, Math.min(DECK.length - 1, i));
  EL.forEach(el => el.style.transition = 'transform .38s cubic-bezier(.25,.9,.3,1),opacity .3s');
  render();
}
/* 重排牌組：聚攏 → 手法 → 攤回新位置
   ponytail: 只動目前可見的 ±4 張，102 張全部參與會掉幀。
   天花板＝看不到整副在動；升級路徑＝改用 canvas 或加大參與張數。 */
let shuffling = false;
const R = n => (Math.random() * 2 - 1) * n;
const win = i => {
  const a = [];
  for (let k = Math.max(0, i - 4); k <= Math.min(DECK.length - 1, i + 4); k++) a.push(k);
  return a;
};
const setT = (idxs, fn, dur, ease) => {
  idxs.forEach((k, n) => {
    const el = EL[k]; if (!el) return;
    el.classList.remove('hide', 'mid');
    el.style.transition = `transform ${dur}ms ${ease || 'cubic-bezier(.3,.8,.3,1)'},opacity ${dur}ms`;
    el.style.transitionDelay = '0ms';
    el.style.opacity = '1';
    el.style.zIndex = String(100 - n);
    el.style.transform = fn(n);
  });
};
const stackT = n => `translate3d(${R(4)}px,${R(3)}px,${-n * 3}px) rotateY(0deg) rotateZ(${R(2.5)}deg) scale(.93)`;
const cutT = (n, dir) => `translate3d(${(n % 2 ? dir : -dir) * 36}px,${R(3)}px,${-n * 3}px) rotateY(0deg) rotateZ(${(n % 2 ? dir : -dir) * 6.5}deg) scale(.93)`;
const tapT = (n, dy) => `translate3d(0px,${dy}px,${-n * 3}px) rotateY(0deg) rotateZ(0deg) scale(.92)`;

/* moves: [{at, fn, dur, ease, buzz}]，end 為手法結束時間 */
function reorder(mix, moves, end){
  if (shuffling) return;
  shuffling = true;
  const held = win(cur);
  setT(held, stackT, 260); buzz(9);
  moves.forEach(m => setTimeout(() => { setT(held, m.fn, m.dur, m.ease); if (m.buzz) buzz(m.buzz); }, m.at));

  setTimeout(() => {
    held.forEach(k => EL[k] && EL[k].classList.add('hide'));
    DECK = buildDeck(mix);
    seqMode = !mix;
    mountDeck();
    mountSegs();
    /* 隨機時優先跳到教練退回的那些，其次才是還沒動過的 */
    const pickBy = fn => DECK.findIndex(fn);
    let first;
    if (mix) {
      first = pickBy(c => stateOf(c) === 'revise');
      if (first < 0) first = pickBy(c => !isDone(c));
    } else {
      first = pickBy(c => c.type === 'write' && stateOf(c) === 'revise');
      if (first < 0) first = pickBy(c => c.type === 'write' && !isDone(c));
    }
    const target = first < 0 ? 0 : first;
    const landedOnRevise = target >= 0 && stateOf(DECK[target]) === 'revise';
    const next = win(target);
    next.forEach((k, n) => {
      const el = EL[k];
      el.classList.remove('hide');
      el.style.transition = 'none';
      el.style.opacity = '1';
      el.style.zIndex = String(100 - n);
      el.style.transform = stackT(n);
    });
    requestAnimationFrame(() => {
      EL.forEach(el => el.style.transition = 'transform .54s cubic-bezier(.2,.9,.25,1),opacity .34s');
      cur = target; shuffling = false; lastTheme = null; render(); drawGrid();
      buzz([10, 50, 14]);
      $('sortBtn').dataset.mode = seqMode ? 'seq' : 'mix';
      $('sortBtn').setAttribute('aria-label', seqMode ? '切換為隨機洗牌' : '切換回課程順序');
      mountSegs();
      toast(landedOnRevise ? '先處理需要補充的這張'
        : mix ? '牌序已打亂' : '已照課程順序整理');
      setTimeout(() => EL.forEach(el =>
        el.style.transition = 'transform .38s cubic-bezier(.25,.9,.3,1),opacity .3s'), 600);
    });
  }, end);
}

/* 一顆鍵在兩種牌序間來回：整理用頓齊，洗牌用切牌 */
const MOVES = {
  mix: [
    { at:270, fn:n => cutT(n, 1),  dur:140, ease:'cubic-bezier(.4,0,.6,1)', buzz:5 },
    { at:415, fn:stackT,           dur:140, buzz:5 },
    { at:560, fn:n => cutT(n, -1), dur:130, ease:'cubic-bezier(.4,0,.6,1)', buzz:5 },
    { at:695, fn:stackT,           dur:130 }
  ],
  seq: [
    { at:270, fn:n => tapT(n, -7), dur:110, ease:'cubic-bezier(.4,0,.6,1)' },
    { at:380, fn:n => tapT(n, 0),  dur:90,  ease:'cubic-bezier(.3,0,.2,1)', buzz:7 },
    { at:470, fn:n => tapT(n, -5), dur:100, ease:'cubic-bezier(.4,0,.6,1)' },
    { at:570, fn:n => tapT(n, 0),  dur:80,  ease:'cubic-bezier(.3,0,.2,1)', buzz:7 }
  ]
};
$('sortBtn').onclick = () => {
  const mix = seqMode;
  reorder(mix, mix ? MOVES.mix : MOVES.seq, mix ? 840 : 680);
};

  $('gTot').innerHTML = '<b>' + done + '</b> / ' + scoped.length;

  $('gStat').innerHTML = ['write','movie','trial'].filter(t => scoped.some(c => c.type === t)).map(t => {
    const l = scoped.filter(c => c.type === t);
    const ok = l.filter(isOK).length, open = l.filter(isOpen).length;
    const sub = t === 'write' && open > ok ? '<small> · 待評 ' + (open - ok) + '</small>' : '';
    return '<div><div class="k">' + KIND[t] + '</div><div class="v">' +
      ok + '<small> / ' + l.length + '</small>' + sub + '</div></div>';
  }).join('');

  $('gChips').innerHTML = FILTERS.filter(([k]) => k === 'all' || k === 'todo' || scoped.some(c => c.type === k)).map(([k, label]) =>
    '<button class="gchip" data-f="' + k + '" aria-pressed="' + (gFilter === k) + '">' + label + '</button>').join('');

  /* 主題區只放故事卡；知識與考驗各自獨立成一區，比散在十個主題裡好找 */
  const SECTIONS = THEMES.map((t, ti) => ({
    label: t, hue: HUE[ti], pick: c => c.type === 'write' && c.group === t
  })).concat([
    { label:'知識卡', hue:'#C9A227', pick: c => c.type === 'movie' },
    { label:'考驗卡', hue:'#C4452B', pick: c => c.type === 'trial' }
  ]);

  let html = '';
  SECTIONS.forEach(sec => {
    const p = portalOf(gPortal);
    const all = DECK.map((c, i) => ({ c, i })).filter(x => sec.pick(x.c) && (!p || p.pick(x.c)));
    const list = all.filter(x =>
      gFilter === 'all' ? true : gFilter === 'todo' ? !isDone(x.c) : x.c.type === gFilter);
    if (!list.length) return;
    const n = all.filter(x => isOK(x.c)).length;
    html += '<div class="gsec"><span class="nm">' + sec.label + '</span>' +
      '<span class="bar"><i style="width:' + Math.round(n / all.length * 100) + '%;background:' + sec.hue + '"></i></span>' +
      '<span class="ct">' + n + '/' + all.length + '</span></div><div class="gg">' +
      list.map(x => {
        const st = stateOf(x.c);
        const statusLabel = { blank:'尚未填寫', pending:'等待回饋', revise:'需要編輯', approved:'認證完成' }[st];
        const inner = x.c.type === 'write'
          ? '<span class="n">' + String(x.c.id).padStart(2, '0') + '</span>'
          : MINI[x.c.type];
        const bg = st === 'approved' ? 'background:' + sec.hue
          : st === 'pending' ? 'background:rgba(232,228,220,.16)'
          : st === 'revise' ? 'background:rgba(232,168,152,.16);border-color:var(--salmon)' : '';
        return '<button class="gc ' + x.c.type + ' st-' + st + (x.i === cur ? ' cur' : '') +
          '" data-g="' + x.i + '" aria-label="' + attr(sec.label + '，' + x.c.title + '，' + statusLabel) +
          '" style="' + bg + '">' + inner + '</button>';
      }).join('') + '</div>';
  });
  $('gBody').innerHTML = html || '<p class="gempty">這個篩選底下沒有卡片</p>';
}
$('gChips').addEventListener('click', e => {
  const b = e.target.closest('.gchip'); if (!b) return;
  gFilter = b.dataset.f; buzz(5); drawGrid();
});
/* 點同步指示做一次連線診斷，把失敗原因講清楚 */
$('sync').onclick = async () => {
  if (!linked()) { $('setApi').click(); return; }
  const lines = [];
  lines.push('端點：' + (GAS ? '已設定' : '未設定'));
  lines.push('試算表：' + (SHEET ? SHEET.slice(0, 12) + '…' : '未連結'));
  lines.push('網路：' + (navigator.onLine ? '連線中' : '離線'));
  lines.push('待送：' + OUTBOX.length + ' 筆');
  if (isFile) lines.push('\n⚠ 目前是用「檔案」方式開啟（file://），瀏覽器會擋掉對外連線。\n請改用網址開啟，或先部署到 GitHub Pages。');
  if (LAST_ERR) lines.push('\n最後一次錯誤：\n' + LAST_ERR);
  if (!SHEET) { alert(lines.join('\n')); return; }
  toast('測試連線中…');
  try {
    const url = GAS + (GAS.indexOf('?') >= 0 ? '&' : '?') +
      'sheet=' + encodeURIComponent(SHEET) + '&t=' + Date.now();
    const res = await fetch(url, { redirect:'follow' });
    const txt = await res.text();
    let j; try { j = JSON.parse(txt); }
    catch (e) { throw new Error('回應不是 JSON：' + txt.slice(0, 120)); }
    if (!j.ok) throw new Error(j.error);
    LAST_ERR = ''; paintSync();
    /* 測完就順手把資料拉下來並補送待送的，不然要等下次開啟才會同步 */
    await pull();
    flush();
    alert(lines.join('\n') + '\n\n✓ 連線正常，已讀取 ' + j.cards.length + ' 張卡片並更新畫面。');
  } catch (e) {
    LAST_ERR = String(e && e.message ? e.message : e);
    paintSync();
    alert(lines.join('\n') + '\n\n✗ 連線失敗：\n' + LAST_ERR);
  }
};

$('rv').onclick = () => {
  let i = DECK.findIndex(c => stateOf(c) === 'revise');
  let msg = '需要補充的第一張';
  if (i < 0) { i = DECK.findIndex(c => (GRADE[cardNo(c)] || {}).feedback); msg = '有教練留言的第一張'; }
  if (i < 0) return;
  goTo(i); buzz(6); toast(msg);
};
$('setApi').onclick = () => {
  if (!GAS) {
    const g = prompt('尚未設定系統端點。\n請貼上教練部署的 Apps Script 網頁應用程式網址：', '');
    if (g === null) return;
    GAS = g.trim(); LS.set('gas', GAS);
  }
  const v = prompt('貼上教練給你的 Google 試算表連結：\n（留空可解除連結，未連結時資料只存在這台裝置）',
    SHEET ? 'https://docs.google.com/spreadsheets/d/' + SHEET + '/edit' : '');
  if (v === null) return;
  if (!v.trim()) { SHEET = ''; LS.set('sheet', ''); paintSync(); toast('已解除連結'); return; }
  const id = sheetId(v);
  if (!id) { toast('這不像試算表連結'); return; }
  SHEET = id; LS.set('sheet', SHEET);
  LAST_ERR = ''; paintSync();
  toast('已連結，讀取中…');
  pull().then(() => { flush(); $('sync').click(); });
};
$('toGrid').onclick = () => {
  lastGridFocus = document.activeElement;
  showJourney(); $('grid').classList.add('on');
  requestAnimationFrame(() => $('gClose').focus({ preventScroll:true }));
};
function exitGrid(){
  $('grid').classList.remove('on','cards-on');
  if (lastGridFocus && lastGridFocus.isConnected) lastGridFocus.focus({ preventScroll:true });
}
function closeGrid(){
  if ($('grid').classList.contains('cards-on')) { showJourney(); return; }
  exitGrid();
}
$('gClose').onclick = closeGrid;
$('gBody').addEventListener('click', e => {
  const g = e.target.closest('.gc'); if (!g) return;
  goTo(+g.dataset.g); exitGrid(); buzz(6);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('sheet').classList.contains('on')) { e.preventDefault(); $('sClose').click(); }
  else if ($('grid').classList.contains('on')) { e.preventDefault(); closeGrid(); }
});
$('act').onclick = doAct;
drawGrid();
paintSync();
flush();
pull();
if (isFile && linked()) {
  setTimeout(() => toast('用檔案開啟時無法同步，請點右上角查看'), 900);
}
}

</script>
