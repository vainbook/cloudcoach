<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>UC 雲端教練 ・ LIFF 連線測試</title>
<!--
  BACKEND-WORKFLOW.md 第 1～2 階段的實驗頁。**這不是正式登入入口。**

  它只做四件事：liff.init()、看登入狀態、取得原始 ID Token、把 Token 送去 GAS 驗。
  不載入題庫、不讀寫 Sheet、不碰 index.html。

  ⚠️ 三條不能違反的規則（BACKEND-WORKFLOW.md §3）：
  1. **只傳原始 ID Token 給 GAS。** 不傳 liff.getProfile() 或
     getDecodedIDToken() 得到的 user ID —— 那是前端說的，不能當登入證明。
     `line_group_activity_system` 就是這樣做的，那套的風險等級才容許。
  2. **畫面、網址、Console 都不完整印出 Token。** 這裡只顯示長度與前後各 6 字。
  3. **不把 Token 放進網址。** 一律 POST body。

  跟 GAS 講話的寫法照抄 line_group_activity_system（已驗證可跑）：
  Content-Type: text/plain（避開 CORS preflight —— GAS 不能自訂回應標頭，
  送 application/json 會因為 preflight 直接失敗）、redirect: follow（GAS 會 302）、
  cache: no-store ＋ 加一個 _ts 參數（GAS 那層會快取）。
-->
<style>
  :root{
    --navy:#131B2E; --beige:#E8E4DC; --salmon:#E8A898;
    --ok:#7FB58A; --bad:#D9776A;
    --mono:'Space Grotesk',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Noto Sans TC',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:28px 20px 60px; background:var(--navy); color:var(--beige);
    font-family:var(--sans); font-size:15px; line-height:1.75;
  }
  .wrap{max-width:520px; margin:0 auto}
  .ey{font-family:var(--mono); font-size:10px; letter-spacing:.18em;
      text-transform:uppercase; color:var(--salmon); opacity:.75; margin:0 0 6px}
  h1{font-size:21px; font-weight:700; margin:0 0 4px; letter-spacing:.02em}
  .sub{font-size:12.5px; opacity:.55; margin:0 0 26px}
  .card{
    background:rgba(232,228,220,.04); border:1px solid rgba(232,228,220,.14);
    border-radius:4px; padding:16px 18px; margin:0 0 14px;
  }
  .card h2{font-family:var(--mono); font-size:10px; letter-spacing:.16em;
    text-transform:uppercase; opacity:.5; margin:0 0 12px; font-weight:500}
  dl{margin:0; display:grid; grid-template-columns:7.5em 1fr; gap:7px 12px}
  dt{font-size:12px; opacity:.5}
  dd{margin:0; font-size:13px; word-break:break-all}
  dd.mono{font-family:var(--mono); font-size:12px}
  .pill{display:inline-block; font-family:var(--mono); font-size:10.5px;
    letter-spacing:.1em; padding:2px 8px; border-radius:20px;
    border:1px solid currentColor}
  .good{color:var(--ok)} .warn{color:var(--salmon)} .fail{color:var(--bad)}
  button{
    font-family:var(--sans); font-size:14px; font-weight:500;
    background:var(--salmon); color:var(--navy); border:0; border-radius:3px;
    padding:12px 20px; cursor:pointer; margin:14px 8px 0 0;
  }
  button.gh{background:none; color:var(--beige); border:1px solid rgba(232,228,220,.28)}
  button:disabled{opacity:.35; cursor:default}
  pre{
    font-family:var(--mono); font-size:11.5px; line-height:1.7; white-space:pre-wrap;
    word-break:break-all; background:rgba(0,0,0,.28); border-radius:3px;
    padding:12px 14px; margin:12px 0 0; max-height:260px; overflow:auto;
  }
  .note{font-size:11.5px; opacity:.45; margin:10px 0 0}
  code{font-family:var(--mono); font-size:12px; background:rgba(0,0,0,.25);
    padding:1px 5px; border-radius:2px}
</style>
</head>
<body>
<div class="wrap">

  <p class="ey">Backend Workflow ・ Stage 1–2</p>
  <h1>LIFF 連線測試</h1>
  <p class="sub">實驗頁，不是正式登入入口。只驗證「LINE 認得這個人」以及「GAS 認得這個 Token」。</p>

  <div class="card">
    <h2>環境</h2>
    <dl>
      <dt>LIFF ID</dt><dd class="mono" id="e-liff">—</dd>
      <dt>SDK</dt><dd id="e-sdk"><span class="pill warn">載入中</span></dd>
      <dt>開啟位置</dt><dd id="e-in">—</dd>
      <dt>OS ／ 版本</dt><dd id="e-os">—</dd>
      <dt>GAS 端點</dt><dd id="e-gas">—</dd>
    </dl>
  </div>

  <div class="card">
    <h2>LINE 登入</h2>
    <dl>
      <dt>狀態</dt><dd id="l-state"><span class="pill warn">尚未初始化</span></dd>
      <dt>ID Token</dt><dd class="mono" id="l-token">—</dd>
    </dl>
    <button id="btn-login" hidden>用 LINE 登入</button>
    <button id="btn-logout" class="gh" hidden>登出</button>
    <p class="note">Token 只顯示長度與前後各 6 字。完整值不進畫面、不進網址、不進 Console。</p>
  </div>

  <div class="card">
    <h2>送去 GAS 驗證（第 2 階段）</h2>
    <p class="note" id="g-hint" style="margin-top:0">
      還沒設定 GAS 端點。把 Apps Script 部署後的網址填進本檔的
      <code>CONFIG.GAS_API_URL</code>。
    </p>
    <button id="btn-verify" hidden>auth.exchange</button>
    <pre id="g-out" hidden></pre>
  </div>

</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  'use strict';

  /* ── 設定 ───────────────────────────────────────────
     LIFF ID 會出現在前端，不是密鑰。Channel secret 絕對不放這裡。
     GAS_API_URL 部署完再填；空字串時第 2 階段的區塊會停用，
     第 1 階段（純 LIFF）照樣可以驗收。 */
  var CONFIG = {
    LIFF_ID: '2011543667-p1MX4tl7',
    GAS_API_URL: 'https://script.google.com/macros/s/AKfycbxTfsHyZ5Nu6c-UDig_xVJAkJJLs8Tp5YrpIWfqqln0rVDAk3-aTkuZGXAw9vgWty8tyg/exec'
  };

  var $ = function (id) { return document.getElementById(id); };
  function pill(el, cls, text) {
    $(el).innerHTML = '<span class="pill ' + cls + '">' + text + '</span>';
  }
  function set(el, text) { $(el).textContent = text; }

  /* 遮罩：只留前後各 6 字。長度也一起給 —— 出問題時「有沒有拿到」和
     「拿到的是不是完整的」是兩件事，長度分得出來。 */
  function mask(s) {
    if (!s) return '—';
    var n = String(s).length;
    if (n <= 14) return '（' + n + ' 字，過短，可疑）';
    return s.slice(0, 6) + '…' + s.slice(-6) + '　（' + n + ' 字）';
  }

  set('e-liff', CONFIG.LIFF_ID);
  set('e-gas', CONFIG.GAS_API_URL ? '已設定' : '未設定');

  if (typeof liff === 'undefined') {
    pill('e-sdk', 'fail', 'SDK 載入失敗');
    pill('l-state', 'fail', '無法初始化');
    return;
  }

  liff.init({ liffId: CONFIG.LIFF_ID })
    .then(function () {
      pill('e-sdk', 'good', 'v' + (liff.getVersion ? liff.getVersion() : '2'));
      set('e-in', liff.isInClient() ? 'LINE 內建瀏覽器' : '外部瀏覽器');
      var os = liff.getOS ? liff.getOS() : '?';
      var ver = liff.getLineVersion ? (liff.getLineVersion() || '（外部瀏覽器沒有）') : '?';
      set('e-os', os + '　/　LINE ' + ver);

      if (!liff.isLoggedIn()) {
        pill('l-state', 'warn', '未登入');
        $('btn-login').hidden = false;
        return;   /* 無 Token 就停在這裡，不往下走 —— 第 1 階段的驗收條件 */
      }

      pill('l-state', 'good', '已登入');
      $('btn-logout').hidden = false;

      var token = liff.getIDToken();
      if (!token) {
        set('l-token', '取不到（scope 可能沒開 openid）');
        return;
      }
      set('l-token', mask(token));
      window.__t = token;                       /* 只放在閉包外供按鈕用，不印出 */

      if (CONFIG.GAS_API_URL) {
        $('g-hint').textContent = '按下按鈕會把原始 ID Token POST 給 GAS，由 GAS 向 LINE 驗證。';
        $('btn-verify').hidden = false;
      }
    })
    .catch(function (err) {
      pill('e-sdk', 'fail', 'init 失敗');
      pill('l-state', 'fail', String(err && err.code || err));
    });

  $('btn-login').addEventListener('click', function () {
    liff.login({ redirectUri: location.href.split('#')[0] });
  });
  $('btn-logout').addEventListener('click', function () {
    liff.logout(); location.reload();
  });

  $('btn-verify').addEventListener('click', function () {
    var btn = $('btn-verify'), out = $('g-out');
    btn.disabled = true; out.hidden = false; out.textContent = '送出中…';

    /* 逾時要自己管 —— GAS 冷啟動可能要好幾秒，但也不能無限等。 */
    var ac = new AbortController();
    var timer = setTimeout(function () { ac.abort(); }, 12000);

    var url = new URL(CONFIG.GAS_API_URL);
    url.searchParams.set('_ts', String(Date.now()));   /* 繞過 GAS 那層快取 */

    fetch(url.toString(), {
      method: 'POST',
      /* ⚠️ text/plain 不是隨便寫的：GAS 不能自訂回應標頭，
         送 application/json 會觸發 CORS preflight，OPTIONS 直接失敗。 */
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'auth.exchange',
        idToken: window.__t,
        requestId: 'liff-test-' + Date.now()
      }),
      redirect: 'follow',
      cache: 'no-store',
      signal: ac.signal
    })
      .then(function (r) { return r.text().then(function (t) { return { s: r.status, t: t }; }); })
      .then(function (r) {
        var pretty;
        try { pretty = JSON.stringify(JSON.parse(r.t), null, 2); }
        catch (e) { pretty = r.t.slice(0, 800); }   /* 回傳 HTML 通常代表部署權限沒開 */
        out.textContent = 'HTTP ' + r.s + '\n\n' + pretty;
      })
      .catch(function (e) {
        out.textContent = e.name === 'AbortError'
          ? '逾時（12 秒）。GAS 可能沒部署，或部署的存取權限不是「任何人」。'
          : '請求失敗：' + e.message + '\n\n多半是跨來源被擋。確認 Apps Script 是'
            + '「以我的身分執行、任何人皆可存取」的網頁應用程式部署。';
      })
      .then(function () { clearTimeout(timer); btn.disabled = false; });
  });
})();
</script>
</body>
</html>
